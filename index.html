  return data.interventions.filter(i=>i.type==='intervention' && i.statutPaiement==='paye' && (i.modePaiement==='especes' || (!i.modePaiement && i.especes)));
}
function budgetEspecesEnCaisse(){
  const fiches = budgetFichesEspeces();
  const recu = fiches.reduce((s,i)=>s+(totalFiche(i)||0),0);
  const enCaisse = fiches.filter(i=>!i.depotId);
  const lies = new Set(fiches.filter(i=>i.depotId).map(i=>i.depotId));
  const depotsLibres = budgetMouvements().filter(x=>x.depotEspeces && !lies.has(x.id)).reduce((s,x)=>s+(parseFloat(x.montant)||0),0);
  const reste = enCaisse.reduce((s,i)=>s+(totalFiche(i)||0),0) - depotsLibres;
  const depose = recu - enCaisse.reduce((s,i)=>s+(totalFiche(i)||0),0) + depotsLibres;
  return { recu: arrondi(recu), depose: arrondi(depose), reste: arrondi(reste), enCaisse };
}

function budgetSuggestionDepot(montant, fiches){
  const n = Math.min(fiches.length, 16), cible = Math.round(montant*100);
  const v = fiches.slice(0,n).map(f=>Math.round((totalFiche(f)||0)*100));
  let meilleur = null, mp = 99;
  for(let m=1; m < (1<<n); m++){
    let sum = 0, pc = 0; for(let k=0;k<n;k++) if(m & (1<<k)){ sum += v[k]; pc++; }
    if(sum === cible && pc < mp){ mp = pc; meilleur = m; }
  }
  return meilleur ? fiches.slice(0,n).filter((_,k)=>meilleur & (1<<k)) : null;
}

  const premierJourMois = new Date(an, mois-1, 1);

  const parJour = {};
  data.interventions.forEach(i=>{
    if(!i.date) return;
    if(!parJour[i.date]) parJour[i.date] = [];
    parJour[i.date].push(i);

  const nomMois = premierJourMois.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

  let grille = '';
  for(let i=0; i<decalage; i++) grille += `<div class="jour-vide"></div>`;
  for(let j=1; j<=nbJoursMois; j++){
    const iso = `${an}-${String(mois).padStart(2,'0')}-${String(j).padStart(2,'0')}`;
    const nb = (parJour[iso]||[]).length;
    const classeCharge = nb >= 5 ? ' charge-3' : nb >= 3 ? ' charge-2' : nb >= 1 ? ' charge-1' : '';
    const estAuj = iso === aujourdhui;

    grille += `<button type="button" class="jour-cal${classeCharge}${estAuj?' auj':''}${estSelectionne?' selectionne':''}" onclick="selectionnerJourCalendrier('${iso}')">
      <span>${j}</span>${nb ? `<span class="jour-cal-pastille">${nb}</span>` : ''}
    </button>`;
  }

  const rdvJour = (parJour[calendrierJourSelectionne]||[]).sort((a,b)=>(a.titre||'').localeCompare(b.titre||''));
  const dateAffichee = new Date(calendrierJourSelectionne+'T00:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

    <div class="calendrier-entete">

      <button class="discret" onclick="changerMoisCalendrier(1)">▶</button>

    <div class="calendrier-jours-noms">
      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="calendrier-grille">${grille}</div>
    <div class="bloc-titre" style="text-transform:capitalize;">${calendrierJourSelectionne===aujourdhui ? "Aujourd'hui" : dateAffichee}</div>
    ${rdvJour.length ? rdvJour.map(i=>{
      const { v, c } = infosVehicule(i.vehiculeId);
      return `<button type="button" class="dossier" onclick="allerInterventions('${i.vehiculeId}')">
        <span class="tab">${i.type==='devis'?'Devis':'Interv.'}</span>

          <div class="titre-d">${esc(i.titre)}</div>
          <div class="sous-info">${esc(c?.prenom)} ${esc(c?.nom)} — ${esc(v?.marque)} ${esc(v?.modele)}</div>
        </div>
        <span class="compte">${formatEuros(totalFiche(i))} €</span>

    }).join('') : '<div class="vide" style="--icone-vide:\'☕\';">Rien de prévu ce jour-là.</div>'}

function sparkline(valeurs, largeur, hauteur){
  largeur = largeur || 100; hauteur = hauteur || 24;
  const max = Math.max(...valeurs, 1);
  const pas = largeur / Math.max(valeurs.length - 1, 1);
  const points = valeurs.map((v,i)=>`${(i*pas).toFixed(1)},${(hauteur - (v/max)*hauteur*0.9 - 1).toFixed(1)}`).join(' ');
  return `<svg width="${largeur}" height="${hauteur}" viewBox="0 0 ${largeur} ${hauteur}" style="display:block;overflow:visible;">
    <polyline points="${points}" fill="none" stroke="var(--money)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function jaugeCirculaire(pct, taille){
  taille = taille || 48;
  const rayon = (taille/2) - 4;
  const circonference = 2 * Math.PI * rayon;
  const decalage = circonference * (1 - Math.max(0,Math.min(100,pct))/100);
  return `<div style="position:relative;width:${taille}px;height:${taille}px;flex-shrink:0;">
    <svg width="${taille}" height="${taille}" viewBox="0 0 ${taille} ${taille}" style="transform:rotate(-90deg);">
      <circle cx="${taille/2}" cy="${taille/2}" r="${rayon}" fill="none" stroke="var(--border)" stroke-width="4"/>
      <circle cx="${taille/2}" cy="${taille/2}" r="${rayon}" fill="none" stroke="var(--money)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${circonference}" stroke-dashoffset="${decalage}" style="transition:stroke-dashoffset .6s ease;"/>
    </svg>
    <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:var(--text);">${pct}%</span>
  </div>`;
}

async function supprimerVehicule(id){

  for(const i of interventionsAssociees){
    if(i.facturePhoto) await supprimerImg(i.id+':facture');
    for(let idx=0; idx<(i.factures||[]).length; idx++) await supprimerImg(i.id+':facture:'+idx);
    for(let idx=0; idx<(i.controles||[]).length; idx++) await supprimerImg(i.id+':ct:'+idx);

  data.interventions = data.interventions.filter(i=>i.vehiculeId!==id);

  allerVehicules(v.clientId);

    for(const i of interventionsAssociees){
      if(i.facturePhoto) await supprimerImg(i.id+':facture');
      for(let idx=0; idx<(i.factures||[]).length; idx++) await supprimerImg(i.id+':facture:'+idx);
      for(let idx=0; idx<(i.controles||[]).length; idx++) await supprimerImg(i.id+':ct:'+idx);

function iconeMode(k){ const m = MODES_PAIEMENT.find(x=>x[0]===k); return m ? m[1] : ''; }
function choisirModePaiement(titre){

    z.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;';

    z.onclick = e=>{ const b = e.target.closest('button'); if(!b && e.target!==z) return; z.remove(); ok(b ? b.dataset.k : '__annuler'); };

function totalFiche(i){
  const mo = parseFloat(i.tarifMO) || 0;
  const p = parseFloat(i.coutPieces) || 0;
  return mo + p;
}
function montantCA(i){
  return arrondi(totalFiche(i) - (parseFloat(i.montantHorsCA)||0) - (parseFloat(i.depensePerso)||0));
}
function achatPourMargeCA(i){
  return i.achatPiecesCA !== undefined ? (parseFloat(i.achatPiecesCA)||0) : (parseFloat(i.prixAchatPieces)||0);
}
function margeCA(i){
  return arrondi(montantCA(i) - achatPourMargeCA(i));
}
function totalVehicule(vehiculeId){
  return data.interventions
    .filter(i=>i.vehiculeId===vehiculeId && i.type==='intervention')
    .reduce((s,i)=>s+totalFiche(i), 0);

function formatEuros(n){
  return n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}

function exporterSauvegarde(){
  const paquet = { data, images: {} };
  for(let k=0; k<localStorage.length; k++){
    const cle = localStorage.key(k);
    if(cle && cle.startsWith('img:')) paquet.images[cle] = localStorage.getItem(cle);
  }
  const blob = new Blob([JSON.stringify(paquet)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'tab-sauvegarde-' + d + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  localStorage.setItem('tab-dernier-export', new Date().toISOString());
}

async function importerSauvegarde(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const texte = await file.text();
    const paquet = JSON.parse(texte);
    if(!paquet || !paquet.data){ afficherToast('Fichier de sauvegarde invalide.', 'erreur'); return; }
    const confirmer = await confirmerAction('Importer cette sauvegarde va remplacer toutes les données actuelles de l\'application. Continuer ?');
    if(!confirmer) return;
    data = paquet.data;
    await sauvegarder();
    if(paquet.images){
      Object.keys(paquet.images).forEach(cle => localStorage.setItem(cle, paquet.images[cle]));
    }
    localStorage.setItem('tab-dernier-export', new Date().toISOString());
    vue = 'clients'; clientCourant = null; vehiculeCourant = null;
    render();
    afficherToast('Sauvegarde importée avec succès.', 'succes');
  } catch(e){
    console.error(e);
    afficherToast('Impossible de lire ce fichier de sauvegarde.', 'erreur');
  }
  evt.target.value = '';
}

function animerCompteurs(){
  document.querySelectorAll('.compteur').forEach(el=>{
    const cible = parseFloat(el.dataset.valeur) || 0;
    const duree = 600;
    const debut = performance.now();
    function etape(maintenant){
      const progres = Math.min((maintenant - debut) / duree, 1);
      const valeur = cible * (1 - Math.pow(1 - progres, 3));
      el.textContent = formatEuros(arrondi(valeur)) + ' €';
      if(progres < 1) requestAnimationFrame(etape);
      else el.textContent = formatEuros(cible) + ' €';
    }
    requestAnimationFrame(etape);
  });
}

function rechercherGlobal(valeur){
  requeteRecherche = valeur;
  if(!valeur.trim()){ renderClients(); return; }
  afficherResultatsRecherche(valeur);
}

function afficherResultatsRecherche(valeur){
  const zone = document.getElementById('zone-resultats');
  if(!zone) return;
  const q = valeur.trim().toLowerCase();
  if(!q){ zone.innerHTML = ''; return; }

  const clientsTrouves = data.clients.filter(c=>
    (c.prenom+' '+c.nom).toLowerCase().includes(q) ||
    (c.telephone||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q));
  const vehiculesTrouves = data.vehicules.filter(v=>
    (v.marque+' '+v.modele).toLowerCase().includes(q) ||
    (v.immatriculation||'').toLowerCase().includes(q));
  const interventionsTrouvees = data.interventions.filter(i=>
    (i.titre||'').toLowerCase().includes(q));

  if(!clientsTrouves.length && !vehiculesTrouves.length && !interventionsTrouvees.length){
    zone.innerHTML = `<div class="vide" style="--icone-vide:'🔍';">Aucun résultat pour « ${esc(valeur)} ».</div>`;
    return;
  }

  let html = '';
  if(clientsTrouves.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Clients</div>`;
    clientsTrouves.forEach(c=>{
      html += `<button type="button" class="dossier" onclick="allerVehicules('${c.id}')">
        <span class="avatar-client" style="background:${couleurAvatar(c.nom+c.prenom)};">${esc((c.prenom[0]||'')+(c.nom[0]||'')).toUpperCase()}</span>
        <div class="info"><div class="titre-d">${esc(c.prenom)} ${esc(c.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  if(vehiculesTrouves.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Véhicules</div>`;
    vehiculesTrouves.forEach(v=>{
      const c = data.clients.find(c=>c.id===v.clientId);
      html += `<button type="button" class="dossier" onclick="allerInterventions('${v.id}')">
        <span class="tab">${esc(v.immatriculation||'—')}</span>
        <div class="info"><div class="titre-d"><span class="pastille-marque" style="background:${couleurMarque(v.marque)};"></span>${esc(v.marque)} ${esc(v.modele)} — ${esc(c?.prenom)} ${esc(c?.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  if(interventionsTrouvees.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Fiches</div>`;
    interventionsTrouvees.forEach(i=>{
      const { v, c } = infosVehicule(i.vehiculeId);
      html += `<button type="button" class="dossier" onclick="allerInterventions('${i.vehiculeId}')">
        <span class="tab">${formatDate(i.date)}</span>
        <div class="info"><div class="titre-d">${esc(i.titre)} — ${esc(v?.marque)} ${esc(v?.modele)}, ${esc(c?.prenom)} ${esc(c?.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  zone.innerHTML = html;
}

async function importerContact(){
  if(!('contacts' in navigator) || !('ContactsManager' in window)){
    afficherToast('L\'import de contacts n\'est pas pris en charge sur cet appareil/navigateur (fonctionne sur Chrome Android).', 'erreur');
    return;
  }
  try{
    const contacts = await navigator.contacts.select(['name','tel','email'], { multiple: false });
    if(!contacts || !contacts.length) return;
    const contact = contacts[0];
    const nomComplet = (contact.name && contact.name[0]) || '';
    const parties = nomComplet.trim().split(/\s+/);
    document.getElementById('c-prenom').value = parties[0] || '';
    document.getElementById('c-nom').value = parties.slice(1).join(' ') || '';
    if(contact.tel && contact.tel[0]) document.getElementById('c-tel').value = contact.tel[0];
    if(contact.email && contact.email[0]) document.getElementById('c-email').value = contact.email[0];
    afficherToast('Contact importé — vérifie les champs avant d\'enregistrer.', 'succes');
  } catch(e){
    console.error(e);
  }
}

async function enregistrerClient(){

  if(!prenom || !nom){ err.textContent='Merci de renseigner le nom et le prénom.'; err.style.display='block'; secouerChamp(!prenom?'c-prenom':'c-nom'); return; }
  if(clientEnEdition){
    const c = data.clients.find(c=>c.id===clientEnEdition);
    Object.assign(c, { prenom, nom, telephone, email, _maj: Date.now() });
  } else {
    data.clients.push({ id: genId(), prenom, nom, telephone, email, _maj: Date.now() });
  }
  await sauvegarder();
  fermerFormClient();
  render();
}

      <div class="champ large" id="champ-statut-devis" style="display:none;margin-bottom:10px;">
        <label>Statut du devis</label>
        <div class="statut-select">
          <button type="button" class="statut-opt en_attente actif" onclick="choisirStatutDevis('en_attente')">En attente</button>
          <button type="button" class="statut-opt valide" onclick="choisirStatutDevis('valide')">Validé</button>
          <button type="button" class="statut-opt refuse" onclick="choisirStatutDevis('refuse')">Refusé</button>
        </div>
      </div>

      <div class="bloc-titre" style="border-top:none;padding-top:0;" id="i-pieces-label">Pièces remplacées</div>
      <div id="pieces-lignes"></div>
      <button class="btn-ajout-ligne" onclick="ajouterLignePiece()">+ Ajouter une pièce</button>
      <div class="apercu-calcul" id="apercu-pieces" style="margin-top:8px;font-weight:600;"></div>
      <div class="apercu-calcul" id="apercu-mo"></div>

      <div class="bloc-titre">Défauts constatés sur le véhicule</div>
      <div id="defauts-lignes"></div>
      <button class="btn-ajout-ligne" onclick="ajouterLigneDefaut()">+ Ajouter un défaut</button>

      <div class="bloc-titre">Documents joints (factures, devis reçus, photos...)</div>
      <label class="upload-label" for="i-facture">Choisir un ou plusieurs fichiers</label>
      <input type="file" id="i-facture" accept="image/*,application/pdf" multiple style="display:none;" onchange="ajouterFacture(event)">
      <div class="apercus" id="apercu-facture"></div>

      <div class="bloc-titre">Rapport(s) de contrôle technique</div>
      <label class="upload-label" for="i-ct">Choisir un ou plusieurs fichiers</label>
      <input type="file" id="i-ct" accept="image/*,application/pdf" multiple style="display:none;" onchange="ajouterCT(event)">
      <div class="apercus" id="apercu-ct"></div>


      <div class="erreur" id="i-erreur" style="display:none;margin-top:10px;"></div>
      <div class="form-actions">
        <button onclick="fermerFormIntervention()">Annuler</button>
        <button class="primaire" onclick="enregistrerIntervention()">Enregistrer</button>
      </div>
    </div>
  `;

  if(!interventions.length){
    html += `<div class="vide" style="--icone-vide:'🔧';">Aucune fiche enregistrée pour ce véhicule.
      <div style="margin-top:14px;"><button class="primaire" onclick="ouvrirFormIntervention()">+ Créer une fiche</button></div>
    </div>`;
    cont.innerHTML = html;
    return;
  }

  cont.innerHTML = html;
  const ficheZone = document.createElement('div');
  cont.appendChild(ficheZone);
  interventions.forEach(async (i)=>{
    const fiche = document.createElement('div');
    fiche.className = 'fiche' + (i.type === 'devis' ? ' fiche-devis' : ' fiche-intervention');
    let defautsHtml = '';
    if(i.defauts && i.defauts.length){
      defautsHtml = `<div class="bloc-titre">Défauts constatés</div><ul class="defauts-liste">${i.defauts.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`;
    }
    const labelPieces = i.type === 'devis' ? 'Pièces prévues' : 'Pièces remplacées';
    let piecesHtml = '';
    if(i.piecesListe && i.piecesListe.length){
      piecesHtml = `<div class="fiche-pieces"><b>${labelPieces}</b><ul style="list-style:none;margin:0;padding:0;">${i.piecesListe.map(p=>{
        const details = [];
        const mentionType = p.typePiece === 'prestataire' ? ' (prestataire, hors CA)' : p.typePiece === 'depense_perso' ? '' : (p.margeZero ? ' (coûtant)' : '');
        if(p.typePiece === 'depense_perso'){
          details.push(`-${formatEuros(p.prixAchat)} € (dépense perso)`);
        } else if(p.prixFacture){
          details.push(`${formatEuros(p.prixFacture)} €${mentionType}`);
        }
        if(p.heures) details.push(`MO ${p.heures} h (${formatEuros(p.tarifMO)} €)`);
        return `<li style="padding:3px 0;border-bottom:1px dashed var(--border);">
          <div style="display:flex;justify-content:space-between;"><span>${esc(p.nom)}${p.ref ? ` <span style="color:var(--text-muted);font-size:11px;">(réf. ${esc(p.ref)})</span>` : ''}</span></div>
          ${details.length ? `<div style="text-align:right;font-size:12px;color:${p.typePiece==='depense_perso'?'var(--danger)':'var(--text-muted)'};">${details.join(' · ')}</div>` : ''}
        </li>`;
      }).join('')}</ul></div>`;
    } else if(i.pieces){
      piecesHtml = `<div class="fiche-pieces"><b>${labelPieces}</b>${esc(i.pieces)}</div>`;
    }
    let tarifsHtml = '';
    const tarifs = [];
    if(i.heuresMO) tarifs.push(`<span>Main d'œuvre&nbsp;: <b>${esc(i.heuresMO)} h → ${formatEuros(i.tarifMO)} €</b></span>`);
    if(i.prixAchatPieces) tarifs.push(`<span>Pièces&nbsp;: <b>${formatEuros(i.coutPieces)} €</b> (achat ${esc(i.prixAchatPieces)} €)</span>`);
    const tf = totalFiche(i);
    if(tf > 0) tarifs.push(`<span class="total">Total&nbsp;: <b>${formatEuros(tf)} €</b></span>`);
    if(i.acompte > 0){
      const solde = arrondi(tf - i.acompte);
      const soldeNegatif = solde < 0;
      tarifs.push(`<span>Acompte versé&nbsp;: <b>${formatEuros(i.acompte)} €</b></span>`);
      tarifs.push(`<span>${soldeNegatif ? 'Trop-perçu' : 'Solde restant'}&nbsp;: <b style="${soldeNegatif ? `color:var(--danger);` : ''}">${formatEuros(Math.abs(solde))} €</b></span>`);
    }
    if(tarifs.length) tarifsHtml = `<div class="fiche-tarifs">${tarifs.join('')}</div>`;
    let paiementHtml = '';
    if(i.type === 'intervention' && tf > 0){
      const paye = i.statutPaiement === 'paye';
      paiementHtml = `<div class="paiement-toggle"><button type="button" class="badge ${paye?'paye':'non_paye'}" onclick="basculerPaiement('${i.id}')">${paye?'Payé':'Non payé'}</button>${paye?` <button type="button" class="badge" title="Mode de règlement" onclick="changerModePaiement('${i.id}')">${i.modePaiement?iconeMode(i.modePaiement)+' '+libelleMode(i.modePaiement):'+ mode'}${i.depotId?' · déposé':''}</button>`:''}</div>`;
    }
    let statutHtml = '';
    if(i.type === 'devis'){
      const statut = i.statutDevis || 'en_attente';
      const libelles = { en_attente:'En attente', valide:'Validé', refuse:'Refusé' };
      statutHtml = `<div class="statut-select">` + Object.keys(libelles).map(s=>
        `<button type="button" class="statut-opt ${s}${s===statut?' actif':''}" onclick="changerStatutDevis('${i.id}','${s}')">${libelles[s]}</button>`
      ).join('') + `</div>`;
      if(statut === 'valide'){
        statutHtml += `<div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="discret commande-btn" onclick="basculerPiecesCommandees('${i.id}')">${i.piecesCommandees ? '✓ Pièces commandées' : 'Marquer pièces commandées'}</button>
          <button class="discret commande-btn" onclick="transformerEnIntervention('${i.id}')">Transformer en intervention</button>
        </div>`;
      }
    }
    let checklistHtml = '';
    if(i.type === 'intervention' && data.reglages.checklist && data.reglages.checklist.length){
      const cochees = i.checklist || {};
      checklistHtml = `<div class="bloc-titre">Checklist de restitution</div><div class="checklist-fiche">${data.reglages.checklist.map((libelle, idx)=>{
        return `<label class="checklist-item">
          <input type="checkbox" ${cochees[libelle] ? 'checked' : ''} onchange="basculerChecklistItem('${i.id}', this.checked, ${idx})">
          <span>${esc(libelle)}</span>
        </label>`;
      }).join('')}</div>`;
    }
    const aDesPhotos = i.facturePhoto || (i.factures||[]).length || (i.controles||[]).length;
    fiche.innerHTML = `
      <div class="fiche-top">
        <div style="display:flex;gap:10px;align-items:flex-start;min-width:0;">
          ${aDesPhotos ? `<img class="vignette-couverture" id="vignette-couverture-${i.id}" style="display:none;">` : ''}
          <div class="fiche-titre-ligne">
            <span class="badge ${i.type === 'devis' ? 'devis' : 'intervention'}">${i.type === 'devis' ? 'Devis' : 'Intervention'}</span>
            <span class="fiche-titre${i.type==='devis' && i.statutDevis==='refuse' ? ' titre-refuse' : ''}">${esc(i.titre)}</span>
          </div>
        </div>
        <div class="fiche-date-actions">
          <span class="fiche-date">${formatDate(i.date)}${i.km ? `<span class="km">${esc(i.km)} km</span>` : ''}</span>
          <button class="bouton-icone" title="Modifier" onclick="ouvrirEditionIntervention('${i.id}')">✎</button>
          <button class="bouton-icone danger" title="Supprimer">✕</button>
        </div>
      </div>
      ${piecesHtml}
      ${tarifsHtml}
      ${paiementHtml}
      ${statutHtml}
      ${defautsHtml}
      ${checklistHtml}
      <div class="bloc-titre" id="pj-titre-${i.id}" style="display:none;">Pièces jointes</div>
      <div class="pieces-jointes" id="pj-${i.id}"></div>
      <div class="fiche-actions-bas">
        <button class="primaire" onclick="imprimerFiche('${i.id}')">📄 Exporter en PDF</button>
        ${i.type==='intervention' ? `<button onclick="imprimerFacture('${i.id}')">🧾 Facture${i.numeroFacture?' '+i.numeroFacture:''}</button>` : ''}
        <button class="secondaire" onclick="ouvrirDiagnostic('${i.id}')">🔍 Diagnostic</button>
        <div class="conteneur-menu-fiche">
          <button class="secondaire" onclick="basculerMenuFiche('${i.id}')" title="Plus d'actions">⋯</button>
          <div class="menu-fiche" id="menu-fiche-${i.id}" style="display:none;">
            <button onclick="dupliquerFiche('${i.id}'); basculerMenuFiche('${i.id}');">⧉ Dupliquer</button>
            ${i.date ? `<button onclick="ouvrirGoogleAgendaParId('${i.id}'); basculerMenuFiche('${i.id}');">📅 Ajouter à Google Agenda</button>` : ''}
          </div>
        </div>
      </div>
    `;
    fiche.querySelector('button[title="Supprimer"]').addEventListener('click', async ()=>{
      if(!(await confirmerAction(`Supprimer définitivement la fiche "${i.titre}" ? Les documents joints seront aussi supprimés. Cette action est irréversible.`))) return;
      if(i.facturePhoto) await supprimerImg(i.id+':facture');
      (i.factures||[]).forEach(async (_,idx)=>await supprimerImg(i.id+':facture:'+idx));
      (i.controles||[]).forEach(async (_,idx)=>await supprimerImg(i.id+':ct:'+idx));
      data.interventions = data.interventions.filter(x=>x.id!==i.id);
      await sauvegarder();
      render();
    });
    ficheZone.appendChild(fiche);
    await renderPiecesJointes(i);
  });
}

async function renderPiecesJointes(i){
  const cont = document.getElementById('pj-'+i.id);
  const titreEl = document.getElementById('pj-titre-'+i.id);
  const couverture = document.getElementById('vignette-couverture-'+i.id);
  if(!cont) return;
  let any = false;
  let couvertureRemplie = false;
  function tenterCouverture(url){
    if(!couvertureRemplie && couverture && url && url.startsWith('data:image')){
      couverture.src = url;
      couverture.style.display = 'block';
      couverture.onclick = ()=>ouvrirLightbox(url);
      couvertureRemplie = true;
    }
  }
  if(i.facturePhoto){
    const url = await chargerImg(i.id+':facture');
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Document')); tenterCouverture(url); }
  }
  for(let idx=0; idx<(i.factures||[]).length; idx++){
    const url = await chargerImg(i.id+':facture:'+idx);
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Document')); tenterCouverture(url); }
  }
  for(let idx=0; idx<(i.controles||[]).length; idx++){
    const url = await chargerImg(i.id+':ct:'+idx);
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Contrôle technique')); tenterCouverture(url); }
  }
  if(any) titreEl.style.display = 'block';
}

function telechargerFichier(dataUrl, nomFichier){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = nomFichier;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function ouvrirLightbox(dataUrl){
  const overlay = document.getElementById('lightbox');
  overlay.innerHTML = `
    <img src="${dataUrl}" style="max-width:92vw;max-height:80vh;border-radius:var(--rayon-s);box-shadow:0 8px 24px rgba(0,0,0,0.3);">
    <button class="primaire" onclick="fermerLightbox()">Fermer</button>
  `;
  overlay.style.display = 'flex';
}
function fermerLightbox(){
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox').innerHTML = '';
}

function creerVignette(dataUrl, label){
  let el;
  const estImage = dataUrl.startsWith('data:image');
  if(estImage){
    el = document.createElement('img');
    el.className = 'vignette';
    el.src = dataUrl;
    el.title = label;
    el.addEventListener('click', ()=>ouvrirLightbox(dataUrl));
  } else {
    el = document.createElement('div');
    el.className = 'vignette-doc';
    el.textContent = label + ' (PDF) — télécharger';
    el.addEventListener('click', ()=>telechargerFichier(dataUrl, label.replace(/\s+/g,'-').toLowerCase() + '.pdf'));
  }
  return el;
}

function choisirType(type){
  typeSelectionne = type;
  document.getElementById('type-intervention').classList.toggle('actif', type==='intervention');
  document.getElementById('type-devis').classList.toggle('actif', type==='devis');
  document.getElementById('i-pieces-label').textContent = type==='devis' ? 'Pièces prévues' : 'Pièces remplacées';
  document.getElementById('champ-statut-devis').style.display = type==='devis' ? 'block' : 'none';
}

let statutDevisSelectionne = 'en_attente';
function choisirStatutDevis(statut){
  statutDevisSelectionne = statut;
  document.querySelectorAll('#champ-statut-devis .statut-opt').forEach(el=>{
    el.classList.toggle('actif', el.classList.contains(statut));
  });
}

function ouvrirFormIntervention(){
  interventionEnEdition = null;
  piecesJointesTemp = { factures: [], controles: [] };
  defautsTemp = [];
  typeSelectionne = 'intervention';
  statutDevisSelectionne = 'en_attente';
  document.getElementById('form-intervention-titre').textContent = 'Nouvelle fiche';
  document.getElementById('form-intervention').classList.add('ouvert');
  document.getElementById('i-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('defauts-lignes').innerHTML = '';
  document.getElementById('pieces-lignes').innerHTML = '';
  document.getElementById('apercu-facture').innerHTML = '';
  document.getElementById('apercu-ct').innerHTML = '';
  document.getElementById('apercu-mo').textContent = '';
  document.getElementById('apercu-pieces').textContent = '';
  document.getElementById('suggestion-catalogue').style.display = 'none';
  peuplerListeCatalogue();
  choisirType('intervention');
  choisirStatutDevis('en_attente');
  ajouterLigneDefaut();
  ajouterLignePiece();

function peuplerListeCatalogue(){
  const dl = document.getElementById('liste-catalogue');
  const catalogue = data.reglages.catalogue || [];
  dl.innerHTML = catalogue.map(entree=>`<option value="${esc(entree.nom)}">`).join('');
}

function suggererTempsHabituel(){
  const titre = document.getElementById('i-titre').value.trim().toLowerCase();
  const catalogue = data.reglages.catalogue || [];
  const trouve = catalogue.find(entree=>entree.nom.toLowerCase() === titre);
  const zone = document.getElementById('suggestion-catalogue');
  if(trouve && trouve.heures){
    zone.style.display = 'block';
    zone.innerHTML = `⏱ Temps habituel pour cette intervention : ${trouve.heures} h — <button type="button" class="discret" style="text-decoration:underline;padding:0;" onclick="appliquerTempsHabituel(${trouve.heures})">Appliquer à la première pièce</button>`;
  } else {
    zone.style.display = 'none';
  }
}

function appliquerTempsHabituel(heures){
  const premiereCarte = document.querySelector('#pieces-lignes .piece-carte');
  if(premiereCarte){
    premiereCarte.querySelector('.piece-heures').value = heures;
    calculerApercus();
  }
}

async function ouvrirEditionIntervention(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  interventionEnEdition = id;
  piecesJointesTemp = { factures: [], controles: [] };
  document.getElementById('form-intervention-titre').textContent = 'Modifier la fiche';
  document.getElementById('form-intervention').classList.add('ouvert');
  document.getElementById('i-titre').value = i.titre || '';
  peuplerListeCatalogue();
  document.getElementById('suggestion-catalogue').style.display = 'none';
  document.getElementById('i-date').value = i.date || '';
  document.getElementById('i-km').value = i.km || '';
  document.getElementById('i-acompte').value = i.acompte || '';
  choisirType(i.type || 'intervention');
  if(i.type === 'devis') choisirStatutDevis(i.statutDevis || 'en_attente');

  document.getElementById('pieces-lignes').innerHTML = '';
  if(i.piecesListe && i.piecesListe.length){
    i.piecesListe.forEach(p=>ajouterLignePiece(p.nom, p.ref, p.prixAchat, p.heures, p.typePiece || (p.margeZero !== undefined ? p.margeZero : i.margeZero)));
  } else if(i.prixAchatPieces || i.heuresMO){
    ajouterLignePiece(i.pieces || 'Pièces', '', i.prixAchatPieces, i.heuresMO, i.margeZero);
  } else {
    ajouterLignePiece();
  }
  calculerApercus();

  document.getElementById('defauts-lignes').innerHTML = '';
  if(i.defauts && i.defauts.length){
    i.defauts.forEach(d=>{
      ajouterLigneDefaut();
      const inputs = document.querySelectorAll('#defauts-lignes input');
      inputs[inputs.length-1].value = d;
    });
  } else {
    ajouterLigneDefaut();
  }

  document.getElementById('apercu-facture').innerHTML = '';
  document.getElementById('apercu-ct').innerHTML = '';
  if(i.facturePhoto){
    const url = await chargerImg(id+':facture');
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Document existant'));
      document.getElementById('apercu-facture').appendChild(item);
    }
  }
  for(let idx=0; idx<(i.factures||[]).length; idx++){
    const url = await chargerImg(id+':facture:'+idx);
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Document existant'));
      document.getElementById('apercu-facture').appendChild(item);
    }
  }
  for(let idx=0; idx<(i.controles||[]).length; idx++){
    const url = await chargerImg(id+':ct:'+idx);
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Contrôle technique actuel'));
      document.getElementById('apercu-ct').appendChild(item);
    }
  }
}

function fermerFormIntervention(){
  document.getElementById('form-intervention').classList.remove('ouvert');
  ['i-titre','i-km','i-acompte'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pieces-lignes').innerHTML = '';
  document.getElementById('i-date').value='';
  document.getElementById('i-erreur').style.display='none';
  document.getElementById('champ-statut-devis').style.display='none';
  document.getElementById('apercu-mo').textContent = '';
  document.getElementById('apercu-pieces').textContent = '';
  piecesJointesTemp = { factures: [], controles: [] };
  defautsTemp = [];
  interventionEnEdition = null;
}

function arrondi(n){ return Math.round(n*100)/100; }

function calculerPrixFacturePiece(typePiece, prixAchat){
  if(typePiece === 'depense_perso') return 0;
  if(typePiece === 'zero' || typePiece === 'prestataire') return arrondi(prixAchat);
  return arrondi(prixAchat * (1 + (data.reglages.margePieces||0)));
}

function ajouterLignePiece(nom, ref, prixAchat, heures, typePieceOuBool){
  let typePiece = 'normale';
  if(typePieceOuBool === true) typePiece = 'zero';
  else if(typeof typePieceOuBool === 'string') typePiece = typePieceOuBool;
  const cont = document.getElementById('pieces-lignes');
  const carte = document.createElement('div');
  carte.className = 'piece-carte';
  carte.dataset.marge = typePiece;
  carte.innerHTML = `
    <div class="piece-entete">
      <input type="text" class="piece-nom" placeholder="Nom de la pièce" value="${nom ? esc(nom) : ''}">
      <button type="button" class="discret" onclick="this.closest('.piece-carte').remove(); calculerApercus();">✕</button>
    </div>
    <div class="piece-champs">
      <div class="champ"><label>Référence</label><input type="text" class="piece-ref" placeholder="Réf." value="${ref ? esc(ref) : ''}"></div>
      <div class="champ"><label>Prix d'achat €</label><input type="number" class="piece-prix" placeholder="0" value="${prixAchat ? esc(String(prixAchat)) : ''}" oninput="calculerApercus()"></div>
      <div class="champ"><label>Main d'œuvre (h)</label><input type="number" step="0.25" class="piece-heures" placeholder="0" value="${heures ? esc(String(heures)) : ''}" oninput="calculerApercus()"></div>
    </div>
    <div class="piece-marge-select">
      <button type="button" class="marge-mini-opt ${typePiece==='normale' ? 'actif' : ''}" data-marge="normale" onclick="choisirMargePiece(this,'normale')">Marge ${Math.round((data.reglages.margePieces||0)*100)}%</button>
      <button type="button" class="marge-mini-opt ${typePiece==='zero' ? 'actif' : ''}" data-marge="zero" onclick="choisirMargePiece(this,'zero')">Prix coûtant</button>
      <button type="button" class="marge-mini-opt ${typePiece==='prestataire' ? 'actif' : ''}" data-marge="prestataire" onclick="choisirMargePiece(this,'prestataire')">Prestataire</button>
      <button type="button" class="marge-mini-opt ${typePiece==='depense_perso' ? 'actif' : ''}" data-marge="depense_perso" onclick="choisirMargePiece(this,'depense_perso')">Dépense perso</button>
    </div>
    <div class="piece-sous-total"></div>
  `;
  cont.appendChild(carte);
  calculerApercus();
}

function choisirMargePiece(bouton, type){
  const carte = bouton.closest('.piece-carte');
  carte.dataset.marge = type;
  carte.querySelectorAll('.marge-mini-opt').forEach(b=>b.classList.toggle('actif', b.dataset.marge===type));
  calculerApercus();
}

function calculerApercus(){
  let totalAchat = 0, totalFacture = 0, totalHeures = 0, totalMO = 0, horsCA = 0, depensePerso = 0;
  document.querySelectorAll('#pieces-lignes .piece-carte').forEach(carte=>{
    const typePiece = carte.dataset.marge;
    const prix = parseFloat(carte.querySelector('.piece-prix').value);
    const heures = parseFloat(carte.querySelector('.piece-heures').value);
    const sousTotal = carte.querySelector('.piece-sous-total');
    const parties = [];
    if(prix > 0){
      const facture = calculerPrixFacturePiece(typePiece, prix);
      if(typePiece === 'prestataire'){
        parties.push(`Prestataire (hors CA)&nbsp;: ${formatEuros(facture)} €`);
        horsCA += facture;
      } else if(typePiece === 'depense_perso'){
        parties.push(`Dépense perso (déduite)&nbsp;: -${formatEuros(prix)} €`);
        depensePerso += prix;
      } else {
        parties.push(`Pièce&nbsp;: ${formatEuros(facture)} €`);
      }
      totalAchat += prix; totalFacture += facture;
    }
    if(heures > 0){
      const tarifLigne = arrondi(heures * data.reglages.tauxHoraire);
      parties.push(`MO&nbsp;: ${formatEuros(tarifLigne)} €`);
      totalHeures += heures; totalMO += tarifLigne;
    }
    sousTotal.innerHTML = parties.join(' · ');
  });
  const apercuPieces = document.getElementById('apercu-pieces');
  const apercuMO = document.getElementById('apercu-mo');
  apercuPieces.textContent = totalFacture > 0 ? `Total pièces facturées : ${formatEuros(arrondi(totalFacture))} €` : '';
  apercuMO.textContent = totalMO > 0 ? `Total main d'œuvre : ${totalHeures} h → ${formatEuros(arrondi(totalMO))} €` : '';
  const notes = [];
  if(horsCA > 0) notes.push(`${formatEuros(arrondi(horsCA))} € en prestataire (hors chiffre)`);
  if(depensePerso > 0) notes.push(`${formatEuros(arrondi(depensePerso))} € en dépense perso (déduite du chiffre et de la marge)`);
  if(notes.length) apercuMO.textContent += (apercuMO.textContent ? ' — ' : '') + notes.join(' — ');
}

function sautDePageSiNecessaire(doc, y){

function finaliserPdf(doc){
  const nbPages = doc.internal.getNumberOfPages();
  for(let p = 1; p <= nbPages; p++){
    doc.setPage(p);
    doc.setDrawColor(15,107,124); doc.setLineWidth(0.4); doc.line(14, 283, 196, 283); doc.setLineWidth(0.2);

    doc.text(`Page ${p} / ${nbPages}`, 196, 289, { align: 'right' });
    doc.setTextColor(43,38,31);
  }
}

async function imprimerDiagnostic(interventionId){
  const i = data.interventions.find(x=>x.id===interventionId);
  if(!i) return;
  const { v, c } = infosVehicule(i.vehiculeId);
  const modele = obtenirModeleDiagnostic();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = enteteBandeauPdf(doc, 'Diagnostic visuel', "Rapport de contrôle du véhicule");
  y = carteInfosPdf(doc, y, c, v, i.km);

  // Synthèse
  const cpt = { ok:0, a_prevoir:0, urgent:0, na:0, non:0 };
  modele.forEach(sec=>sec.items.forEach(it=>{
    const e = (i.diagnostic && i.diagnostic[cleItemDiag(sec.categorie, it)]) || {};
    if(e.statut && cpt[e.statut] !== undefined) cpt[e.statut]++; else cpt.non++;
  }));
  const blocs = [['ok','OK'],['a_prevoir','À PRÉVOIR'],['urgent','URGENT']];
  const largeur = 58;
  blocs.forEach(([k,lib],idx)=>{
    const x = 14 + idx*(largeur+4);
    doc.setFillColor(...RGB_FOND_STATUT_DIAG[k]);
    doc.roundedRect(x, y, largeur, 20, 3, 3, 'F');
    doc.setFillColor(...RGB_STATUT_DIAG[k]);
    doc.roundedRect(x, y, 3, 20, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...RGB_STATUT_DIAG[k]);
    doc.text(String(cpt[k]), x+10, y+13.5);
    doc.setFontSize(9);
    doc.text(lib, x+22, y+12);
  });
  doc.setTextColor(...PDF_TEXTE);
  y += 30;

  for(const sec of modele){
    y = sautDePageSiNecessaire(doc, y + 0);
    if(y > 255){ doc.addPage(); y = 20; }
    // titre de catégorie
    doc.setFillColor(...PDF_TEAL);
    doc.roundedRect(14, y, 182, 8, 2, 2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
    doc.text(sec.categorie.toUpperCase(), 19, y+5.6);
    doc.setTextColor(...PDF_TEXTE);
    y += 15;
    let zebre = false;
    for(const item of sec.items){
      const cle = cleItemDiag(sec.categorie, item);
      const entree = (i.diagnostic && i.diagnostic[cle]) || {};
      const statut = entree.statut;
      const lignesRem = entree.remarque ? doc.splitTextToSize(entree.remarque, 120) : [];
      const nbPh = Math.min(entree.nbPhotos || 0, 4);
      const hauteur = 8 + lignesRem.length*4.2 + (nbPh ? 24 : 0);
      if(y + hauteur > 278){ doc.addPage(); y = 20; zebre = false; }
      if(zebre){ doc.setFillColor(...PDF_FOND); doc.rect(14, y-5, 182, hauteur, 'F'); }
      zebre = !zebre;
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...PDF_TEXTE);
      doc.text(item, 19, y);
      if(statut && RGB_STATUT_DIAG[statut]){
        pastillePdf(doc, LIBELLES_STATUT_DIAG[statut], 192, y-1.4, RGB_STATUT_DIAG[statut], RGB_FOND_STATUT_DIAG[statut]);
      } else {
        doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(170,176,180);
        doc.text('non contrôlé', 192, y, { align: 'right' });
        doc.setTextColor(...PDF_TEXTE);
      }
      let yy = y + 4.5;
      if(lignesRem.length){
        doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(...PDF_GRIS);
        doc.text(lignesRem, 23, yy);
        yy += lignesRem.length*4.2;
        doc.setTextColor(...PDF_TEXTE);
      }
      if(nbPh){
        for(let k=0; k<nbPh; k++){
          try{
            const url = await chargerImg(i.id+':diag:'+cle+':'+k);
            if(url) doc.addImage(url, typeImgPdf(url), 23 + k*32, yy-1, 30, 20);
          }catch(e){}
        }
        yy += 22;
      }
      y = yy + 4.5;
    }
    y += 4;
  }

  if(i.diagnosticCommentaire){
    const lignes = doc.splitTextToSize(i.diagnosticCommentaire, 170);
    const h = 14 + lignes.length*5;
    if(y + h > 278){ doc.addPage(); y = 20; }
    doc.setFillColor(...PDF_FOND); doc.setDrawColor(215,225,228);
    doc.roundedRect(14, y, 182, h, 3, 3, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...PDF_TEAL);
    doc.text('COMMENTAIRES GÉNÉRAUX', 20, y+8);
    doc.setFont('helvetica','normal'); doc.setTextColor(...PDF_TEXTE);
    doc.text(lignes, 20, y+14);
  }

  finaliserPdf(doc);
  doc.save(`diagnostic-${(v?.marque||'')}-${(v?.modele||'')}.pdf`.replace(/\s+/g,'-').toLowerCase());
}

function imprimerFiche(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  const { v, c } = infosVehicule(i.vehiculeId);
  const estDevis = i.type === 'devis';
  const labelPieces = estDevis ? 'Pièces prévues' : 'Pièces remplacées';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = enteteBandeauPdf(doc, estDevis ? 'Devis' : "Fiche d'intervention", 'Date : ' + formatDate(i.date));
  y = carteInfosPdf(doc, y, c, v, i.km);

  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...PDF_TEXTE);
  y += 4;
  const titreL = doc.splitTextToSize(i.titre || '', 180);
  doc.text(titreL, 14, y); y += titreL.length*6 + 4;

  const enteteTableau = (libelle)=>{
    doc.setFillColor(...PDF_TEAL);
    doc.rect(14, y-5, 182, 8, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(libelle.toUpperCase(), 18, y);
    doc.text('PRIX', 192, y, { align: 'right' });
    doc.setTextColor(...PDF_TEXTE);
    y += 8;
  };

  if(i.piecesListe && i.piecesListe.length){
    enteteTableau(labelPieces);
    let zebre = false;
    i.piecesListe.forEach(p=>{
      if(y > 268){ doc.addPage(); y = 25; }
      if(zebre){ doc.setFillColor(...PDF_FOND); doc.rect(14, y-5, 182, p.heures ? 11 : 7, 'F'); }
      zebre = !zebre;
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...PDF_TEXTE);
      doc.text(p.ref ? `${p.nom} (réf. ${p.ref})` : p.nom, 18, y);
      if(p.prixFacture){
        doc.setFont('helvetica','bold');
        doc.text(`${formatEuros(p.prixFacture)} €`, 192, y, { align: 'right' });
      }
      y += 5;
      if(p.heures){
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...PDF_GRIS);
        doc.text(`Main d'œuvre : ${p.heures} h (${formatEuros(p.tarifMO)} €)`, 22, y);
        doc.setTextColor(...PDF_TEXTE);
        y += 4.5;
      }
      y += 2;
    });
    y += 4;
  } else if(i.pieces){
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const lignes = doc.splitTextToSize(`${labelPieces} : ${i.pieces}`, 180);
    doc.text(lignes, 14, y); y += lignes.length*5 + 5;
  }

  if(i.defauts && i.defauts.length){
    if(y > 250){ doc.addPage(); y = 25; }
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...PDF_TEAL);
    doc.text('DÉFAUTS CONSTATÉS', 14, y); y += 6;
    doc.setFont('helvetica','normal'); doc.setTextColor(...PDF_TEXTE);
    i.defauts.forEach(d=>{
      const lignes = doc.splitTextToSize(d, 170);
      if(y + lignes.length*5 > 275){ doc.addPage(); y = 25; }
      doc.setFillColor(190,62,44); doc.circle(17, y-1.2, 0.9, 'F');
      doc.text(lignes, 21, y); y += lignes.length*5 + 1;
    });
    y += 6;
  }

  if(i.heuresMO || i.prixAchatPieces){
    const nbLignes = (i.heuresMO?1:0) + (i.prixAchatPieces?1:0) + (i.acompte > 0 ? 2 : 0);
    const h = 14 + nbLignes*7;
    if(y + h > 278){ doc.addPage(); y = 25; }
    doc.setFillColor(...PDF_FOND); doc.setDrawColor(215,225,228);
    doc.roundedRect(100, y, 96, h, 3, 3, 'FD');
    let ty = y + 8;
    doc.setFontSize(10);
    const ligne = (lib, val, gras)=>{
      doc.setFont('helvetica', gras ? 'bold' : 'normal'); doc.setTextColor(...PDF_TEXTE);
      doc.text(lib, 105, ty); doc.text(val, 191, ty, { align: 'right' }); ty += 7;
    };
    if(i.heuresMO) ligne(`Main d'œuvre (${i.heuresMO} h)`, `${formatEuros(i.tarifMO)} €`);
    if(i.prixAchatPieces) ligne('Pièces', `${formatEuros(i.coutPieces)} €`);
    doc.setDrawColor(...PDF_TEAL); doc.line(105, ty-4.5, 191, ty-4.5);
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...PDF_TEAL);
    doc.text('TOTAL', 105, ty+1); doc.text(`${formatEuros(totalFiche(i))} €`, 191, ty+1, { align: 'right' });
    ty += 8; doc.setFontSize(10);
    if(i.acompte > 0){
      const soldePdf = arrondi(totalFiche(i) - i.acompte);
      ligne('Acompte versé', `${formatEuros(i.acompte)} €`);
      ligne(soldePdf < 0 ? 'Trop-perçu' : 'Solde restant', `${formatEuros(Math.abs(soldePdf))} €`, true);
    }
    doc.setFillColor(...PDF_FOND);
  }

  const nomBase = (i.titre||'fiche').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  finaliserPdf(doc);
  doc.save(`${estDevis?'devis':'intervention'}-${nomBase}.pdf`);
}

function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function dateVersICS(iso, decalageJours){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + (decalageJours||0));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const j = String(d.getDate()).padStart(2,'0');
  return `${y}${m}${j}`;
}
function creerEtTelechargerICS(intervention, client, vehicule){
  const debut = dateVersICS(intervention.date, 0);
  const fin = dateVersICS(intervention.date, 1);
  const maintenant = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const resume = `${intervention.type === 'devis' ? 'Devis' : 'Intervention'} — ${intervention.titre}`;
  const description = `${vehicule ? vehicule.marque + ' ' + vehicule.modele : ''}${vehicule?.immatriculation ? ' (' + vehicule.immatriculation + ')' : ''}${client ? ' — client : ' + client.prenom + ' ' + client.nom : ''}`;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TAB//FR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + intervention.id + '@tab-app',
    'DTSTAMP:' + maintenant,
    'DTSTART;VALUE=DATE:' + debut,
    'DTEND;VALUE=DATE:' + fin,
    'SUMMARY:' + icsEscape(resume),
    'DESCRIPTION:' + icsEscape(description),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Rappel','TRIGGER:-P1D','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rdv-' + intervention.id + '.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

async function enregistrerIntervention(){
  const titre = document.getElementById('i-titre').value.trim();
  const date = document.getElementById('i-date').value;
  const km = document.getElementById('i-km').value.trim();
  const acompte = parseFloat(document.getElementById('i-acompte').value) || 0;

  const piecesListe = Array.from(document.querySelectorAll('#pieces-lignes .piece-carte'))
    .map(carte=>{
      const nom = carte.querySelector('.piece-nom').value.trim();
      const ref = carte.querySelector('.piece-ref').value.trim();
      const prixAchat = parseFloat(carte.querySelector('.piece-prix').value);
      const heures = parseFloat(carte.querySelector('.piece-heures').value);
      const typePiece = carte.dataset.marge || 'normale';
      if(!nom && !(prixAchat > 0) && !(heures > 0)) return null;
      const prixFacture = prixAchat > 0 ? calculerPrixFacturePiece(typePiece, prixAchat) : 0;
      const tarifMOligne = heures > 0 ? arrondi(heures * data.reglages.tauxHoraire) : 0;
      return {
        nom: nom || 'Pièce', ref,
        prixAchat: prixAchat > 0 ? prixAchat : 0, prixFacture,
        heures: heures > 0 ? heures : 0, tarifMO: tarifMOligne,
        typePiece, margeZero: typePiece === 'zero'
      };
    })
    .filter(Boolean);
  const prixAchatPieces = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.prixAchat,0)) : '';
  const coutPieces = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.prixFacture,0)) : '';
  const heuresMO = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.heures,0)) : '';
  const tarifMO = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.tarifMO,0)) : '';
  const montantHorsCA = arrondi(piecesListe.filter(p=>p.typePiece==='prestataire').reduce((s,p)=>s+p.prixFacture,0));
  const depensePerso = arrondi(piecesListe.filter(p=>p.typePiece==='depense_perso').reduce((s,p)=>s+p.prixAchat,0));
  const achatPiecesCA = arrondi(piecesListe.filter(p=>p.typePiece==='normale'||p.typePiece==='zero').reduce((s,p)=>s+p.prixAchat,0));

  const err = document.getElementById('i-erreur');
  if(!titre || !date){ err.textContent='Merci de renseigner au moins l\'intitulé et la date.'; err.style.display='block'; secouerChamp(!titre?'i-titre':'i-date'); return; }

  const defauts = Array.from(document.querySelectorAll('#defauts-lignes input'))
    .map(inp=>inp.value.trim()).filter(Boolean);

  const id = interventionEnEdition || genId();
  const controlesValides = piecesJointesTemp.controles.filter(Boolean);
  const facturesValides = piecesJointesTemp.factures.filter(Boolean);

  if(interventionEnEdition){
    const existante = data.interventions.find(x=>x.id===interventionEnEdition);
    const nbControlesAvant = (existante.controles||[]).length;
    const nbFacturesAvant = (existante.factures||[]).length;
    Object.assign(existante, {
      type: typeSelectionne, titre, date, km,
      piecesListe, heuresMO, prixAchatPieces, tarifMO, coutPieces, acompte, montantHorsCA, depensePerso, achatPiecesCA,
      statutDevis: typeSelectionne==='devis' ? statutDevisSelectionne : null,
      defauts, _maj: Date.now()
    });
    delete existante.pieces;
    for(let idx=0; idx<facturesValides.length; idx++){
      await sauvegarderImg(id+':facture:'+(nbFacturesAvant+idx), facturesValides[idx]);
    }
    if(facturesValides.length){
      existante.factures = [...(existante.factures||[]), ...facturesValides.map(()=>true)];
    }
    for(let idx=0; idx<controlesValides.length; idx++){
      await sauvegarderImg(id+':ct:'+(nbControlesAvant+idx), controlesValides[idx]);
    }
    if(controlesValides.length){
      existante.controles = [...(existante.controles||[]), ...controlesValides.map(()=>true)];
    }
    await sauvegarder();
    fermerFormIntervention();
    render();
    return;
  }

  const nouvelleIntervention = {
    id, vehiculeId: vehiculeCourant, type: typeSelectionne, titre, date, km,
    piecesListe, heuresMO, prixAchatPieces, tarifMO, coutPieces, acompte, montantHorsCA, depensePerso, achatPiecesCA,
    statutDevis: typeSelectionne==='devis' ? statutDevisSelectionne : null,
    statutPaiement: typeSelectionne==='intervention' ? 'non_paye' : null,
    piecesCommandees: false,
    defauts,
    factures: facturesValides.map(()=>true),
    controles: controlesValides.map(()=>true),
    _maj: Date.now()
  };
  data.interventions.push(nouvelleIntervention);

  for(let idx=0; idx<facturesValides.length; idx++){
    await sauvegarderImg(id+':facture:'+idx, facturesValides[idx]);
  }
  for(let idx=0; idx<controlesValides.length; idx++){
    await sauvegarderImg(id+':ct:'+idx, controlesValides[idx]);
  }

  await sauvegarder();
  const { v, c } = infosVehicule(vehiculeCourant);
  creerEtTelechargerICS(nouvelleIntervention, c, v);
  fermerFormIntervention();
  render();
}
