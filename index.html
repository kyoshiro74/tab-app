<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F1ED" id="meta-theme-color">
<title>TAB — Dossiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F2F1ED; --surface:#FFFFFF; --surface-2:#F6F5F1;
    --accent:#254E5F; --steel:#7C929A;
    --money:#356A4F; --warning:#A3742A;
    --text:#211F1B; --text-muted:#68645A; --danger:#A8422F; --success:#356A4F; --border:#D2CDBD;
  }
  body.sombre{
    --bg:#181D21; --surface:#232A2F; --surface-2:#2A3237;
    --accent:#6BAEC2; --steel:#8CA3AB;
    --money:#7AC397; --warning:#E0B266;
    --text:#F7F9FA; --text-muted:#A6AFB4; --danger:#E39C88; --success:#7AC397; --border:#4A555C;
  }
  body.contraste-eleve{ --text:#000000; --text-muted:#2E2C28; --border:#8A8478; }
  body.contraste-eleve.sombre{ --text:#FFFFFF; --text-muted:#DCDFE1; --border:#7A848A; }
  body.contraste-eleve .fiche, body.contraste-eleve .dossier, body.contraste-eleve .stat-carte, body.contraste-eleve .formulaire{ border-width:2px; }
  *{box-sizing:border-box;}
  ::selection{background:var(--accent);color:#FFFFFF;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--steel);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;transition:background-color .2s ease,color .2s ease;scrollbar-color:var(--border) transparent;}
  .app{max-width:900px;margin:0 auto;padding:26px 18px 84px;}
  header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 0;margin:-26px -18px 18px;padding-left:18px;padding-right:18px;transition:background-color .2s ease,border-color .2s ease;}
  header.top h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;margin:0;letter-spacing:.4px;}
  header.top p{margin:2px 0 0;color:var(--text-muted);font-size:12.5px;}
  #contenu{animation:apparitionContenu .18s ease;}
  @keyframes apparitionContenu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .fil{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);margin-bottom:18px;font-family:'Oswald',sans-serif;letter-spacing:.2px;}
  .fil span.sep{color:var(--border);font-size:15px;}
  .fil button.lien{background:none;border:none;color:var(--text-muted);font-family:'Oswald',sans-serif;font-size:12.5px;cursor:pointer;padding:0;text-decoration:none;}
  .fil button.lien:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}
  .fil .courant{color:var(--text);font-weight:600;}

  .panneau-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .panneau-header h2{font-family:'Oswald',sans-serif;font-size:19px;margin:0;font-weight:600;}
  .panneau-header .sous{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .carte-rappel{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:10px;}
  .carte-rappel-icone{font-size:20px;flex-shrink:0;}
  .carte-rappel-texte{flex:1;font-size:12.5px;color:var(--text-muted);}
  .carte-rappel-titre{font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text);font-weight:600;margin-bottom:1px;}
  .carte-rappel.retard{border-color:var(--danger);background:rgba(168,66,47,0.08);}
  .carte-rappel.retard .carte-rappel-texte{color:var(--danger);}
  .carte-rappel button.discret{padding:2px 4px;}

  .alerte{border-left:3px solid var(--accent);border-radius:6px;background:var(--surface-2);padding:11px 13px;margin-bottom:10px;}
  .alerte.rouge{border-left-color:var(--danger);}
  .alerte-titre{font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--text);margin-bottom:8px;}
  .alerte-ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px;}
  .alerte-ligne:first-of-type{border-top:none;}
  .alerte-ligne .desc{color:var(--text);cursor:pointer;}
  .alerte-ligne .desc b{color:var(--accent);font-weight:600;}
  .alerte-ligne .desc:hover{text-decoration:underline;}
  .alerte-ligne .quand{color:var(--text-muted);white-space:nowrap;margin-left:8px;}

  .statut-select{display:inline-flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
  .statut-opt{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);cursor:pointer;color:var(--text-muted);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);box-shadow:0 1px 0 rgba(40,35,28,0.12);transition:all .12s ease;}
  .statut-opt.actif{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(40,35,28,0.24);}
  .statut-opt.actif.en_attente{border-color:var(--warning);color:#8C6624;background:rgba(184,134,58,0.16);}
  .statut-opt.actif.valide{border-color:var(--success);color:#2E5E44;background:rgba(63,122,92,0.16);}
  .statut-opt.actif.refuse{border-color:var(--danger);color:#8C3D2F;background:rgba(181,79,63,0.16);}
  .commande-btn{font-size:11px;padding:4px 9px;margin-top:6px;}

  .recherche-zone{margin-bottom:16px;position:relative;}
  .recherche-zone::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none;}
  .recherche-zone input{font-size:14px;padding-left:34px;}
  .resultat-groupe{margin-bottom:14px;}
  .resultat-groupe-titre{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}

  .badge.paye{background:rgba(63,122,92,0.16);color:#2E5E44;}
  .badge.non_paye{background:rgba(181,79,63,0.16);color:#8C3D2F;}
  .paiement-toggle{margin:6px 0;}

  .total-ligne{font-size:12.5px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .total-ligne b{color:var(--money);font-weight:600;}
  .fiche-tarifs .total{color:var(--money);font-weight:600;}

  .barre-outils{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .barre-outils button{font-size:12px;padding:7px 12px;}
  input[type="file"].cache{display:none;}

  .pastille-cloche{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10.5px;line-height:18px;text-align:center;font-family:'Inter',sans-serif;font-weight:600;padding:0 2px;}

  .fab{position:fixed;bottom:76px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(165deg,#3D7387 0%,var(--accent) 100%);color:#FFFFFF;font-size:28px;font-weight:300;border:none;box-shadow:0 6px 16px rgba(20,42,50,0.4),0 3px 8px rgba(20,42,50,0.28);z-index:60;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;line-height:1;padding:0;}
  .fab:hover{transform:scale(1.06);box-shadow:0 8px 20px rgba(20,42,50,0.45),0 4px 10px rgba(20,42,50,0.3);}
  .fab:active{transform:scale(0.94);}

  .nav-bas{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb, var(--surface) 90%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:55;padding-bottom:env(safe-area-inset-bottom, 0);}
  .nav-bas-item{flex:1;background:none;border:none;box-shadow:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--text-muted);transition:color .12s ease;}
  .nav-bas-item:active{transform:none;box-shadow:none;}
  .nav-bas-item span:first-child{font-size:19px;}
  .nav-bas-item.actif{color:var(--accent);}
  #panneau-notifs{margin-bottom:14px;animation:apparitionPanneau .18s ease;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 10px 28px rgba(0,0,0,0.1);max-height:60vh;overflow-y:auto;}
  @keyframes apparitionPanneau{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  .stats-periodes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
  @media (min-width:700px){.stats-periodes{grid-template-columns:repeat(4,1fr);}}
  .stat-carte{background:linear-gradient(165deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:0 2px 0 rgba(40,35,28,0.10),0 3px 8px rgba(40,35,28,0.12);transition:transform .15s ease,box-shadow .15s ease;}
  .stat-carte:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(40,35,28,0.10),0 6px 14px rgba(40,35,28,0.18);}
  .stat-titre{font-family:'Oswald',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:4px;}
  .stat-nb{font-size:11px;color:var(--text-muted);}
  .stat-montant{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--money);margin-top:2px;font-variant-numeric:tabular-nums;}
  .stat-marge{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .stat-tendance{font-size:10.5px;color:var(--text-muted);margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);font-weight:600;}

  .fiche-actions-bas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .fiche-actions-bas button{font-size:11.5px;padding:6px 10px;}
  .conteneur-menu-fiche{position:relative;}
  .menu-fiche{position:absolute;bottom:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,0.16);padding:6px;z-index:20;min-width:190px;flex-direction:column;gap:2px;animation:ouvertureFormulaire .15s ease;}
  .menu-fiche button{text-align:left;background:none;box-shadow:none;border:none;padding:9px 10px;font-size:12.5px;color:var(--text);border-radius:6px;}
  .menu-fiche button:hover{background:var(--surface-2);}
  .menu-fiche button:active{transform:none;}

  #zone-impression{display:none;}

  #zone-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:420px;pointer-events:none;}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,0.18);font-size:13px;color:var(--text);line-height:1.4;animation:toastEntree .22s ease, toastSortie .25s ease 3.2s forwards;pointer-events:auto;width:100%;}
  .toast.succes{border-left-color:var(--money);}
  .toast.erreur{border-left-color:var(--danger);}
  @keyframes toastEntree{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastSortie{to{opacity:0;transform:translateY(-8px);}}

  .boite-confirm{background:var(--surface);border-radius:14px;padding:22px;max-width:360px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,0.22);animation:toastEntree .18s ease;}
  .boite-confirm p{font-size:14px;color:var(--text);margin:0 0 20px;line-height:1.5;}
  .boite-confirm .form-actions{margin-top:0;}
  @media print{
    body > *{display:none !important;}
    #zone-impression{display:block !important;position:absolute;top:0;left:0;width:100%;}
  }

  button{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.2px;border-radius:8px;border:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);color:var(--text);padding:10px 16px;cursor:pointer;font-size:13px;box-shadow:0 2px 0 rgba(40,35,28,0.14),0 1px 3px rgba(40,35,28,0.12);transition:all .12s ease;}
  button:active{transform:translateY(1px);box-shadow:0 0 0 rgba(62,54,44,0),inset 0 1px 3px rgba(40,35,28,0.20);}
  button.primaire{background:linear-gradient(180deg,#3D7387 0%,var(--accent) 100%);border-color:#1E3F4C;color:#FFFFFF;box-shadow:0 2px 0 rgba(20,42,50,0.35),0 2px 5px rgba(20,42,50,0.18);}
  button.primaire:hover{background:linear-gradient(180deg,#437D93 0%,#2C5D70 100%);}
  button.primaire:active{box-shadow:inset 0 1px 4px rgba(20,42,50,0.35);}
  button.secondaire{background:transparent;box-shadow:none;color:var(--text-muted);border-color:var(--border);}
  button.secondaire:hover{color:var(--accent);border-color:var(--accent);}
  button.danger-sub{background:transparent;box-shadow:none;color:var(--danger);border-color:rgba(181,79,63,0.35);}
  button.danger-sub:hover{background:rgba(181,79,63,0.08);}
  button.discret{background:none;border:none;color:var(--text-muted);padding:4px 6px;font-family:'Inter',sans-serif;font-size:12px;box-shadow:none;}
  button.discret:active{box-shadow:none;transform:none;}
  button.discret:hover{color:var(--danger);}

  input, textarea, select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;border-radius:7px;padding:9px 10px;width:100%;}
  input::placeholder, textarea::placeholder{color:var(--text-muted);opacity:.85;}
  input[type="number"]{-moz-appearance:textfield;}
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  textarea{resize:vertical;min-height:56px;}

  .dossier{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:9px;cursor:pointer;box-shadow:0 3px 0 rgba(40,35,28,0.10),0 2px 6px rgba(40,35,28,0.14);transition:all .12s ease;width:100%;text-align:left;font-family:'Inter',sans-serif;}
  .dossier:hover{box-shadow:0 4px 0 rgba(40,35,28,0.12),0 4px 12px rgba(40,35,28,0.20);transform:translateY(-1px);}
  .dossier:active{box-shadow:inset 0 2px 4px rgba(40,35,28,0.22);transform:translateY(2px);}
  .dossier .tab{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;background:var(--accent);color:#FFF8F0;border-radius:5px;padding:4px 8px;white-space:nowrap;}
  .avatar-client{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;color:#FFF8F0;border-radius:50%;width:34px;height:34px;min-width:34px;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
  .pastille-marque{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0;}
  .lettre-groupe{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:1.5px;margin:16px 2px 6px;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .lettre-groupe:first-child{margin-top:0;}
  .dossier .info{flex:1;min-width:0;}
  .dossier .titre-d{font-size:14px;color:var(--text);}
  .dossier .sous-info{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .dossier .compte{font-size:11px;color:var(--text-muted);white-space:nowrap;}

  .vide{border:1px dashed var(--border);border-radius:10px;padding:36px 18px;text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:14px;}
  .vide::before{content:"📂";display:block;font-size:26px;margin-bottom:8px;opacity:.5;}

  .formulaire{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:18px;display:none;}
  .formulaire.ouvert{display:block;animation:ouvertureFormulaire .2s ease;}
  @keyframes ouvertureFormulaire{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .formulaire h3{font-family:'Oswald',sans-serif;font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .grille.trois{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:520px){.grille, .grille.trois{grid-template-columns:1fr 1fr;}}
  @media (max-width:400px){.grille, .grille.trois{grid-template-columns:1fr;}}
  .champ{display:flex;flex-direction:column;gap:5px;}
  .champ label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
  .champ.large{grid-column:1/-1;}
  .champ-titre-grand{font-size:17px;padding:13px 14px;font-weight:500;}
  .champ .apercu-calcul{font-size:12px;color:var(--money);margin-top:2px;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .erreur{color:var(--danger);font-size:12px;margin:-4px 0 8px;}

  .type-select{display:flex;gap:8px;margin-bottom:12px;}
  .type-opt{flex:1;border:1px solid var(--border);border-radius:7px;padding:9px;text-align:center;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.3px;color:var(--text-muted);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);box-shadow:0 2px 0 rgba(40,35,28,0.12),0 1px 2px rgba(40,35,28,0.10);transition:all .12s ease;}
  .type-opt.actif{border-color:var(--accent);color:#1E3F4C;background:linear-gradient(180deg,rgba(44,93,112,0.16) 0%,rgba(44,93,112,0.09) 100%);box-shadow:inset 0 2px 4px rgba(20,42,50,0.16);transform:translateY(1px);}

  .defaut-ligne{display:flex;gap:6px;margin-bottom:6px;}
  .defaut-ligne input{flex:1;}
  .btn-ajout-ligne{align-self:flex-start;font-size:12px;padding:6px 10px;margin-top:2px;}

  .piece-carte{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 10px 8px;margin-bottom:8px;}
  .piece-carte .piece-entete{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .piece-carte .piece-nom{flex:1;}
  .piece-champs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media (max-width:480px){.piece-champs{grid-template-columns:1fr 1fr;}}
  .piece-champs .champ label{font-size:10px;}
  .piece-sous-total{text-align:right;font-size:11.5px;color:var(--money);margin-top:6px;}
  .piece-marge-select{display:flex;gap:6px;margin-top:8px;}
  .marge-mini-opt{flex:1;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;padding:5px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);box-shadow:none;transition:all .12s ease;}
  .marge-mini-opt.actif{border-color:var(--money);color:var(--money);background:rgba(63,106,79,0.1);box-shadow:inset 0 1px 2px rgba(40,35,28,0.1);}

  .fiche{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px 17px 13px;margin-bottom:15px;box-shadow:0 1px 3px rgba(40,35,28,0.10);transition:box-shadow .15s ease;}
  .fiche:hover{box-shadow:0 3px 10px rgba(40,35,28,0.16);}
  .fiche::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background-image:radial-gradient(circle,var(--surface-2) 1.5px,transparent 1.5px);background-size:8px 1px;}
  .fiche-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .fiche-titre-ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

const firebaseConfig = {

try{
  firebase.initializeApp(firebaseConfig);

function fusionnerListe(listeLocale, listeDistante){
  const map = new Map();
  (listeDistante||[]).forEach(item=>map.set(item.id, item));
  (listeLocale||[]).forEach(item=>{
    const existant = map.get(item.id);
    if(!existant || (item._maj||0) >= (existant._maj||0)) map.set(item.id, item);
  });
  return Array.from(map.values());
}
function fusionnerDonnees(local, distant){
  if(!distant) return local;
  if(!local) return distant;
  return {
    clients: fusionnerListe(local.clients, distant.clients),
    vehicules: fusionnerListe(local.vehicules, distant.vehicules),
    interventions: fusionnerListe(local.interventions, distant.interventions),
    reglages: (local.dernierMaj||0) >= (distant.dernierMaj||0) ? (local.reglages||{}) : (distant.reglages||{}),
    dernierMaj: Math.max(local.dernierMaj||0, distant.dernierMaj||0)
  };
}

function refGarage(code){ return firebaseDb.collection('garages').doc(code); }
function refCollection(type, code){ return refGarage(code).collection(type); }

let dernierEtatSynchro = null;
function figerEtatSynchro(){
  dernierEtatSynchro = {
    clients: JSON.parse(JSON.stringify(data.clients||[])),
    vehicules: JSON.parse(JSON.stringify(data.vehicules||[])),
    interventions: JSON.parse(JSON.stringify(data.interventions||[]))
  };
}

async function recupererToutDepuisFirebase(code){
  if(!firebaseDb) return null;
  try{
    const [clientsSnap, vehiculesSnap, interventionsSnap, garageDoc] = await Promise.all([
      refCollection('clients', code).get(),
      refCollection('vehicules', code).get(),
      refCollection('interventions', code).get(),
      refGarage(code).get()
    ]);
    localStorage.removeItem('tab-sync-erreur');
    const meta = garageDoc.exists ? garageDoc.data() : {};
    let clients = clientsSnap.docs.map(d=>d.data());
    let vehicules = vehiculesSnap.docs.map(d=>d.data());
    let interventions = interventionsSnap.docs.map(d=>d.data());
    let migre = false;
    /* Migration transparente depuis l'ancien format (toutes les données dans un seul document) */
    if(!clients.length && !vehicules.length && !interventions.length && Array.isArray(meta.clients)){
      clients = meta.clients || [];
      vehicules = meta.vehicules || [];
      interventions = meta.interventions || [];
      migre = clients.length > 0 || vehicules.length > 0 || interventions.length > 0;
    }
    return { clients, vehicules, interventions, reglages: meta.reglages, dernierMaj: meta.dernierMaj || 0, migre };
  } catch(e){
    console.error('Erreur de lecture Firebase', e);
    localStorage.setItem('tab-sync-erreur', (e && e.message) || String(e));
    return null;
  }
}

/* Envoie uniquement les clients/véhicules/fiches qui ont changé depuis la dernière synchronisation,
   au lieu de tout le dossier d'un coup — plus rapide, moins de données, et une suppression reste une vraie suppression. */
async function synchroniserVersFirebase(){
  const code = localStorage.getItem('tab-code-sync');
  if(!code || !firebaseDb) return;
  try{
    const avant = dernierEtatSynchro || { clients: [], vehicules: [], interventions: [] };
    let batch = firebaseDb.batch();
    let nbOperations = 0;
    const limiterBatch = async ()=>{
      if(nbOperations >= 450){
        await batch.commit();
        batch = firebaseDb.batch();
        nbOperations = 0;
      }
    };
    for(const type of ['clients','vehicules','interventions']){
      const col = refCollection(type, code);
      const actuels = data[type] || [];
      const idsAvant = new Map((avant[type]||[]).map(x=>[x.id, x]));
      const idsActuels = new Set(actuels.map(x=>x.id));
      for(const item of actuels){
        const ancien = idsAvant.get(item.id);
        if(!ancien || JSON.stringify(ancien) !== JSON.stringify(item)){
          await limiterBatch();
          batch.set(col.doc(item.id), item);
          nbOperations++;
        }
      }
      for(const [id] of idsAvant){
        if(!idsActuels.has(id)){
          await limiterBatch();
          batch.delete(col.doc(id));
          nbOperations++;
        }
      }
    }
    batch.set(refGarage(code), { reglages: data.reglages, dernierMaj: data.dernierMaj }, { merge: true });
    nbOperations++;
    if(nbOperations > 0) await batch.commit();
    figerEtatSynchro();
    localStorage.setItem('tab-sync-derniere-reussite', new Date().toISOString());
    localStorage.removeItem('tab-sync-erreur');
    const derniereHisto = parseInt(localStorage.getItem('tab-derniere-historique')||'0');
    if(Date.now() - derniereHisto > 15*60*1000){
      enregistrerHistorique(code);
      localStorage.setItem('tab-derniere-historique', String(Date.now()));
    }
  } catch(e){
    console.error('Erreur de synchronisation', e);
    localStorage.setItem('tab-sync-erreur', (e && e.message) || String(e));
  }
}

async function enregistrerHistorique(code){
  if(!firebaseDb) return;
  try{
    const horodatage = Date.now();
    await refGarage(code).collection('historique').doc(String(horodatage)).set({
      clients: data.clients, vehicules: data.vehicules, interventions: data.interventions,
      reglages: data.reglages, _horodatage: horodatage
    });
    const snap = await refGarage(code).collection('historique').orderBy('_horodatage','desc').get();
    if(snap.size > 5){
      const aSupprimer = snap.docs.slice(5);
      for(const d of aSupprimer) await d.ref.delete();
    }
  } catch(e){ console.error('Erreur historique', e); }
}

async function listerHistorique(){
  const code = localStorage.getItem('tab-code-sync');
  if(!code || !firebaseDb) return [];
  try{
    const snap = await refGarage(code).collection('historique').orderBy('_horodatage','desc').get();
    return snap.docs.map(d=>d.data());
  } catch(e){ console.error(e); return []; }
}

async function chargerEtAfficherHistorique(){
  const zone = document.getElementById('zone-historique');
  zone.innerHTML = '<p style="font-size:12px;color:var(--text-muted);">Chargement...</p>';
  const liste = await listerHistorique();
  if(!liste.length){
    zone.innerHTML = '<p style="font-size:12px;color:var(--text-muted);">Aucun historique disponible pour le moment (il se remplit progressivement au fil des synchronisations).</p>';
    return;
  }
  zone.innerHTML = liste.map(v=>{
    const dateStr = new Date(v._horodatage).toLocaleString('fr-FR');
    return `<div class="alerte-ligne"><span class="desc" style="cursor:default;">${esc(dateStr)} — ${(v.clients||[]).length} client(s), ${(v.interventions||[]).length} fiche(s)</span><button class="discret commande-btn" onclick="restaurerHistorique(${v._horodatage})">Restaurer</button></div>`;
  }).join('');
}

async function restaurerHistorique(horodatage){
  if(!(await confirmerAction('Restaurer cette version va remplacer toutes les données actuelles, sur cet appareil et pour tous les appareils synchronisés. Continuer ?'))) return;
  const code = localStorage.getItem('tab-code-sync');
  if(!code || !firebaseDb) return;
  try{
    const doc = await refGarage(code).collection('historique').doc(String(horodatage)).get();
    if(!doc.exists){ afficherToast('Version introuvable.', 'erreur'); return; }
    const version = doc.data();
    delete version._horodatage;
    figerEtatSynchro();
    data = { clients: version.clients||[], vehicules: version.vehicules||[], interventions: version.interventions||[], reglages: version.reglages||data.reglages, dernierMaj: Date.now() };
    try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
    await synchroniserVersFirebase();
    render();
    afficherToast('Version restaurée avec succès.', 'succes');
  } catch(e){
    console.error(e);
    afficherToast('Erreur lors de la restauration.', 'erreur');
  }
}

let annulateursEcoute = [];
function demarrerEcouteSynchro(code){
  if(!firebaseDb || !code) return;
  arreterEcouteSynchro();
  ['clients','vehicules','interventions'].forEach(type=>{
    const annuler = refCollection(type, code).onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      let changement = false;
      snap.docChanges().forEach(ch=>{
        const item = ch.doc.data();
        const liste = data[type];
        const idx = liste.findIndex(x=>x.id===item.id);
        if(ch.type === 'removed'){
          if(idx !== -1){ liste.splice(idx,1); changement = true; }
        } else if(idx === -1){
          liste.push(item); changement = true;
        } else if(JSON.stringify(liste[idx]) !== JSON.stringify(item)){
          liste[idx] = item; changement = true;
        }
      });
      if(changement){
        try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
        if(dernierEtatSynchro) dernierEtatSynchro[type] = JSON.parse(JSON.stringify(data[type]));
        if(document.getElementById('verrou').style.display !== 'flex') render();
      }
    }, err=>console.error('Erreur d\'écoute Firebase', err));
    annulateursEcoute.push(annuler);
  });
}
function arreterEcouteSynchro(){
  annulateursEcoute.forEach(a=>a());
  annulateursEcoute = [];
}

let data = { clients: [], vehicules: [], interventions: [], reglages: { tauxHoraire: 55, margePieces: 0.20, pin: null } };

const PALETTE_AVATARS = ['#5A7EA8','#7A8C5C','#A87B5A','#8C6BA8','#5CA88C','#A85C7B','#6B90A8','#A8905C'];
function couleurAvatar(texte){
  const s = (texte||'?');
  let hash = 0;
  for(let i=0;i<s.length;i++) hash = s.charCodeAt(i) + ((hash<<5)-hash);
  return PALETTE_AVATARS[Math.abs(hash) % PALETTE_AVATARS.length];
}
const PALETTE_MARQUES = {
  'mercedes':'#5A7A8C', 'bmw':'#4A6FA5', 'audi':'#8C4A4A', 'volkswagen':'#4A6B95', 'vw':'#4A6B95',
  'peugeot':'#4A7A6B', 'renault':'#A55A4A', 'citroen':'#6B5A95', 'citroën':'#6B5A95',
  'toyota':'#A5824A', 'nissan':'#5A5A95', 'ford':'#4A5A95', 'opel':'#8C8C4A',
  'fiat':'#A54A5A', 'seat':'#A5824A', 'skoda':'#4A8C6B', 'hyundai':'#4A6B8C',
  'kia':'#8C4A6B', 'dacia':'#6B7A4A', 'volvo':'#4A5A6B', 'mini':'#8C6B4A'
};
function couleurMarque(marque){
  const m = (marque||'').trim().toLowerCase();
  if(PALETTE_MARQUES[m]) return PALETTE_MARQUES[m];
  let hash = 0;
  for(let i=0;i<m.length;i++) hash = m.charCodeAt(i) + ((hash<<5)-hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 32%, 42%)`;
}
function formatDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function tempsRelatif(iso){
  if(!iso) return '';
  const jours = Math.floor((Date.now() - new Date(iso+'T00:00:00').getTime()) / 86400000);
  if(jours < 0) return formatDate(iso) + ' (à venir)';
  if(jours === 0) return "aujourd'hui";
  if(jours === 1) return 'hier';
  if(jours < 30) return `il y a ${jours} jours`;
  const mois = Math.floor(jours/30);
  if(mois < 12) return `il y a ${mois} mois`;
  const ans = Math.floor(mois/12);
  return `il y a ${ans} an${ans>1?'s':''}`;
}

async function basculerContrasteEleve(){
  const actif = localStorage.getItem('tab-contraste-eleve') === 'oui';
  localStorage.setItem('tab-contraste-eleve', actif ? 'non' : 'oui');
  appliquerContrasteEleve();
  renderReglages();
}

async function charger(){
  appliquerTheme();
  appliquerTailleTexte();
  appliquerContrasteEleve();
  try{
    const val = localStorage.getItem(CLE);
    if(val) data = JSON.parse(val);
  } catch(e){ /* pas de données encore */ }
  if(!data.reglages) data.reglages = { tauxHoraire: 55, margePieces: 0.20, pin: null };
  if(data.reglages.tauxHoraire === undefined) data.reglages.tauxHoraire = 55;
  if(data.reglages.margePieces === undefined) data.reglages.margePieces = 0.20;

  const splash = document.getElementById('splash');
  if(splash){
    setTimeout(()=>{
      splash.style.opacity = '0';
      setTimeout(()=>splash.remove(), 300);
    }, 400);
  }

  const codeSync = localStorage.getItem('tab-code-sync');
  if(codeSync){
    const distant = await recupererToutDepuisFirebase(codeSync);
    if(distant){
      dernierEtatSynchro = distant.migre ? { clients: [], vehicules: [], interventions: [] } : { clients: distant.clients, vehicules: distant.vehicules, interventions: distant.interventions };
      const fusion = fusionnerDonnees(data, distant);
      const localModifie = JSON.stringify(fusion) !== JSON.stringify(data);
      data = fusion;
      try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
      if(localModifie) synchroniserVersFirebase();
      else figerEtatSynchro();
    }
    demarrerEcouteSynchro(codeSync);
  }

  if(data.reglages.pin){
    document.getElementById('app-principal').style.display = 'none';
    document.getElementById('verrou').style.display = 'flex';
  } else {
    render();
    verifierRappelPieces();
    verifierSauvegardeAuto();
  }
}
function verifierSauvegardeAuto(){
  if(data.reglages.sauvegardeAutoActive === false) return;
  if(!data.clients.length && !data.vehicules.length) return;
  const dernier = localStorage.getItem('tab-dernier-export');
  const jours = dernier ? Math.floor((Date.now() - new Date(dernier).getTime()) / 86400000) : null;
  if(jours === null || jours >= 7){
    exporterSauvegarde();
  }
}
function verifierRappelPieces(){
  if(!data.reglages.rappelsActifs) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const aujourdhui = new Date().toISOString().slice(0,10);
  if(localStorage.getItem('tab-dernier-rappel-pieces') === aujourdhui) return;
  const enAttente = data.interventions.filter(i=>i.type==='devis' && i.statutDevis==='valide' && !i.piecesCommandees);
  if(!enAttente.length) return;
  try{
    new Notification('TAB — Pièces à commander', {
      body: `${enAttente.length} devis validé${enAttente.length>1?'s':''} en attente de commande de pièces.`
    });
  } catch(e){}
  localStorage.setItem('tab-dernier-rappel-pieces', aujourdhui);
}
function verifierPin(){
  const saisie = document.getElementById('pin-saisie').value.trim();
  if(saisie && saisie === data.reglages.pin){
    document.getElementById('verrou').style.display = 'none';
    document.getElementById('app-principal').style.display = 'block';
    document.getElementById('pin-erreur').style.display = 'none';
    render();
  } else {
    document.getElementById('pin-erreur').style.display = 'block';
  }
}
let minuteurSynchro = null;
async function sauvegarder(){
  data.dernierMaj = Date.now();
  try{ localStorage.setItem(CLE, JSON.stringify(data)); }
  catch(e){ console.error('Erreur de sauvegarde (mémoire du téléphone pleine ?)', e); afficherToast('Espace de stockage insuffisant sur ce téléphone. Essayez de supprimer une photo jointe volumineuse.', 'erreur'); }
  clearTimeout(minuteurSynchro);
  minuteurSynchro = setTimeout(()=>{ synchroniserVersFirebase(); }, 600);
}
async function sauvegarderImg(id, dataUrl){
  try{ localStorage.setItem('img:'+id, dataUrl); }
  catch(e){ console.error(e); afficherToast('Impossible d\'enregistrer cette image (espace de stockage insuffisant).', 'erreur'); }
}
async function chargerImg(id){
  try{ return localStorage.getItem('img:'+id); }
  catch(e){ return null; }
}
async function supprimerImg(id){
  try{ localStorage.removeItem('img:'+id); } catch(e){}
}

function fichierVersBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('lecture échouée'));
    r.readAsDataURL(file);
  });
}

function renderFil(){
  const fil = document.getElementById('fil');
  if(vue === 'reglages'){
    fil.innerHTML = `<button class="lien" onclick="allerClients()">Clients</button><span class="sep">›</span><span class="courant">Réglages</span>`;
    return;

  if(vue === 'filtres'){
    fil.innerHTML = `<button class="lien" onclick="allerClients()">Clients</button><span class="sep">›</span><span class="courant">Vue d'ensemble</span>`;
    return;
  }
  let html = `<button class="lien" onclick="allerClients()">Clients</button>`;
  if(vue === 'vehicules' || vue === 'interventions'){
    const c = data.clients.find(c=>c.id===clientCourant);
    html += `<span class="sep">›</span>`;
    html += vue === 'vehicules'
      ? `<span class="courant">${esc(c?.prenom)} ${esc(c?.nom)}</span>`

async function enregistrerReglagesTarifs(){
  const taux = parseFloat(document.getElementById('r-taux').value);
  const marge = parseFloat(document.getElementById('r-marge').value);
  const err = document.getElementById('r-erreur');
  if(!(taux > 0) || isNaN(marge) || marge < 0){
    err.textContent = 'Merci de renseigner un taux horaire et une marge valides.';
    err.style.display = 'block';
    return;
  }
  data.reglages.tauxHoraire = taux;
  data.reglages.margePieces = marge / 100;
  await sauvegarder();
  afficherToast('Réglages enregistrés.', 'succes');
}

async function definirPin(){
  const nouveau = document.getElementById('r-nouveau-pin').value.trim();
  const confirme = document.getElementById('r-confirme-pin').value.trim();
  const err = document.getElementById('r-pin-erreur');
  if(!/^[0-9]{4,8}$/.test(nouveau)){
    err.textContent = 'Le code doit contenir entre 4 et 8 chiffres.';
    err.style.display = 'block';
    return;
  }
  if(nouveau !== confirme){
    err.textContent = 'Les deux codes ne correspondent pas.';
    err.style.display = 'block';
    return;
  }
  data.reglages.pin = nouveau;
  await sauvegarder();
  renderReglages();
}

  data.reglages.pin = null;
  await sauvegarder();
  renderReglages();
}

async function enregistrerCatalogue(){
  const catalogue = Array.from(document.querySelectorAll('#catalogue-lignes > div'))
    .map(ligne=>{
      const nom = ligne.querySelector('.catalogue-nom').value.trim();
      const heures = parseFloat(ligne.querySelector('.catalogue-heures').value);
      if(!nom) return null;
      return { nom, heures: heures > 0 ? heures : null };
    })
    .filter(Boolean);

  await sauvegarder();
  afficherToast('Interventions courantes enregistrées.', 'succes');

async function activerRappelsPieces(){
  if(!('Notification' in window)){

  if(permission !== 'granted'){
    afficherToast('Autorisation refusée — impossible d\'activer les rappels sans ta permission.', 'erreur');
    return;
  }
  data.reglages.rappelsActifs = true;
  await sauvegarder();
  renderReglages();
}

async function desactiverRappelsPieces(){
  data.reglages.rappelsActifs = false;
  await sauvegarder();
  renderReglages();
}

async function activerSynchronisation(){
  const code = document.getElementById('r-code-sync').value.trim().toLowerCase().replace(/\s+/g,'-');
  const err = document.getElementById('r-sync-erreur');
  if(code.length < 6){
    err.textContent = 'Choisis un code d\'au moins 6 caractères, unique pour toi (ex. le nom de ton garage + une année).';
    err.style.display = 'block';
    return;
  }
  if(!firebaseDb){
    err.textContent = 'La connexion au service de synchronisation a échoué. Vérifie ta connexion internet.';
    err.style.display = 'block';
    return;
  }
  const distant = await recupererToutDepuisFirebase(code);
  if(distant){
    const confirmer = await confirmerAction('Des données existent déjà pour ce code. Fusionner avec les données de cet appareil (rien ne sera perdu des deux côtés) ?');
    if(!confirmer) return;
    dernierEtatSynchro = distant.migre ? { clients: [], vehicules: [], interventions: [] } : { clients: distant.clients, vehicules: distant.vehicules, interventions: distant.interventions };
    data = fusionnerDonnees(data, distant);
    localStorage.setItem(CLE, JSON.stringify(data));
    localStorage.setItem('tab-code-sync', code);
    await sauvegarder();
  } else {
    const confirmer = await confirmerAction('Aucune donnée trouvée pour ce code. Créer un nouvel espace de synchronisation avec les données actuelles de cet appareil ?');
    if(!confirmer) return;
    dernierEtatSynchro = { clients: [], vehicules: [], interventions: [] };
    localStorage.setItem('tab-code-sync', code);
    await sauvegarder();
  }
  renderReglages();
  render();
  demarrerEcouteSynchro(code);
  afficherToast('Synchronisation activée — les mises à jour arriveront automatiquement.', 'succes');
}

async function desactiverSynchronisation(){
  if(!(await confirmerAction('Désactiver la synchronisation sur cet appareil ? Tes données restent sur ce téléphone mais ne seront plus mises à jour avec les autres appareils.'))) return;
  localStorage.removeItem('tab-code-sync');
  arreterEcouteSynchro();
  dernierEtatSynchro = null;
  renderReglages();
}

async function synchroniserMaintenant(){
  const code = localStorage.getItem('tab-code-sync');
  if(!code){ afficherToast('Aucun code de synchronisation actif.', 'erreur'); return; }
  const distant = await recupererToutDepuisFirebase(code);
  if(!distant){ afficherToast('Impossible de joindre le service de synchronisation.', 'erreur'); return; }
  const fusion = fusionnerDonnees(data, distant);
  const change = JSON.stringify(fusion) !== JSON.stringify(data);
  dernierEtatSynchro = distant.migre ? { clients: [], vehicules: [], interventions: [] } : { clients: distant.clients, vehicules: distant.vehicules, interventions: distant.interventions };
  data = fusion;
  try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
  await synchroniserVersFirebase();
  render();
  afficherToast(change ? 'Données fusionnées avec l\'autre appareil.' : 'Cet appareil était déjà à jour.', 'succes');
}

  if(document.visibilityState !== 'visible'){
    if(minuteurSynchro){
      clearTimeout(minuteurSynchro);
      minuteurSynchro = null;
      synchroniserVersFirebase();
    }
    return;
  }
  const code = localStorage.getItem('tab-code-sync');
  if(!code || document.getElementById('verrou').style.display === 'flex') return;
  const distant = await recupererToutDepuisFirebase(code);
  if(!distant) return;
  const fusion = fusionnerDonnees(data, distant);
  const change = JSON.stringify(fusion) !== JSON.stringify(data);
  if(!change) return;
  dernierEtatSynchro = distant.migre ? { clients: [], vehicules: [], interventions: [] } : { clients: distant.clients, vehicules: distant.vehicules, interventions: distant.interventions };
  data = fusion;
  try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
  render();
  synchroniserVersFirebase();
});

function infosVehicule(vehiculeId){
  const v = data.vehicules.find(v=>v.id===vehiculeId);
  const c = v ? data.clients.find(c=>c.id===v.clientId) : null;
  return { v, c };
}

async function transformerEnIntervention(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  if(!(await confirmerAction('Transformer ce devis en intervention réalisée ?'))) return;
  i.type = 'intervention';
  i.statutPaiement = 'non_paye';
  i._maj = Date.now();
  delete i.statutDevis;
  delete i.piecesCommandees;
  await sauvegarder();
  render();
}

async function dupliquerFiche(id){
  const original = data.interventions.find(x=>x.id===id);
  if(!original) return;
  const copie = {
    ...original,
    id: genId(),
    date: new Date().toISOString().slice(0,10),
    facturePhoto: false,
    controles: [],
    factures: [],
    acompte: 0,
    statutPaiement: original.type === 'intervention' ? 'non_paye' : undefined,
    piecesCommandees: original.type === 'devis' ? false : undefined,
    _maj: Date.now()
  };
  data.interventions.push(copie);
  await sauvegarder();
  render();
  ouvrirEditionIntervention(copie.id);
}

async function supprimerVehicule(id){
  const v = data.vehicules.find(v=>v.id===id);
  if(!v) return;
  const interventionsAssociees = data.interventions.filter(i=>i.vehiculeId===id);
  if(!(await confirmerAction(`Supprimer définitivement "${v.marque} ${v.modele}" et ${interventionsAssociees.length} fiche(s) associée(s) ? Cette action est irréversible.`))) return;
  for(const i of interventionsAssociees){
    if(i.facturePhoto) await supprimerImg(i.id+':facture');
    for(let idx=0; idx<(i.factures||[]).length; idx++) await supprimerImg(i.id+':facture:'+idx);
    for(let idx=0; idx<(i.controles||[]).length; idx++) await supprimerImg(i.id+':ct:'+idx);
  }
  data.interventions = data.interventions.filter(i=>i.vehiculeId!==id);
  data.vehicules = data.vehicules.filter(x=>x.id!==id);
  await sauvegarder();
  allerVehicules(v.clientId);
}

async function supprimerClient(id){
  const c = data.clients.find(c=>c.id===id);
  if(!c) return;
  const vehiculesAssocies = data.vehicules.filter(v=>v.clientId===id);
  const idsVehicules = vehiculesAssocies.map(v=>v.id);
  const nbFiches = data.interventions.filter(i=>idsVehicules.includes(i.vehiculeId)).length;
  if(!(await confirmerAction(`Supprimer définitivement le dossier de "${c.prenom} ${c.nom}", ${vehiculesAssocies.length} véhicule(s) et ${nbFiches} fiche(s) ? Cette action est irréversible.`))) return;
  for(const v of vehiculesAssocies){
    const interventionsAssociees = data.interventions.filter(i=>i.vehiculeId===v.id);
    for(const i of interventionsAssociees){
      if(i.facturePhoto) await supprimerImg(i.id+':facture');
      for(let idx=0; idx<(i.factures||[]).length; idx++) await supprimerImg(i.id+':facture:'+idx);
      for(let idx=0; idx<(i.controles||[]).length; idx++) await supprimerImg(i.id+':ct:'+idx);
    }
  }
  data.interventions = data.interventions.filter(i=>!idsVehicules.includes(i.vehiculeId));
  data.vehicules = data.vehicules.filter(v=>v.clientId!==id);
  data.clients = data.clients.filter(x=>x.id!==id);
  await sauvegarder();
  allerClients();
}

async function changerStatutDevis(id, statut){
  const i = data.interventions.find(i=>i.id===id);
  if(!i) return;
  i.statutDevis = statut;
  i._maj = Date.now();
  await sauvegarder();
  render();
}
async function basculerPiecesCommandees(id){
  const i = data.interventions.find(i=>i.id===id);
  if(!i) return;
  i.piecesCommandees = !i.piecesCommandees;
  i._maj = Date.now();
  await sauvegarder();
  render();
}
async function basculerPaiement(id){
  const i = data.interventions.find(i=>i.id===id);
  if(!i) return;
  i.statutPaiement = i.statutPaiement === 'paye' ? 'non_paye' : 'paye';
  i._maj = Date.now();
  await sauvegarder();
  render();
}
function totalFiche(i){
  const mo = parseFloat(i.tarifMO) || 0;
  const p = parseFloat(i.coutPieces) || 0;
  return mo + p;
}
function totalVehicule(vehiculeId){
  return data.interventions
    .filter(i=>i.vehiculeId===vehiculeId && i.type==='intervention')
    .reduce((s,i)=>s+totalFiche(i), 0);
}
function totalClient(clientId){
  const idsVehicules = data.vehicules.filter(v=>v.clientId===clientId).map(v=>v.id);
  return data.interventions
    .filter(i=>idsVehicules.includes(i.vehiculeId) && i.type==='intervention')
    .reduce((s,i)=>s+totalFiche(i), 0);
}
function formatEuros(n){
  return n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}

function exporterSauvegarde(){
  const paquet = { data, images: {} };
  for(let k=0; k<localStorage.length; k++){
    const cle = localStorage.key(k);
    if(cle && cle.startsWith('img:')) paquet.images[cle] = localStorage.getItem(cle);
  }
  const blob = new Blob([JSON.stringify(paquet)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'tab-sauvegarde-' + d + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  localStorage.setItem('tab-dernier-export', new Date().toISOString());
}

function declencherImport(){

}
async function importerSauvegarde(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const texte = await file.text();
    const paquet = JSON.parse(texte);
    if(!paquet || !paquet.data){ afficherToast('Fichier de sauvegarde invalide.', 'erreur'); return; }
    const confirmer = await confirmerAction('Importer cette sauvegarde va remplacer toutes les données actuelles de l\'application. Continuer ?');
    if(!confirmer) return;
    data = paquet.data;
    await sauvegarder();
    if(paquet.images){
      Object.keys(paquet.images).forEach(cle => localStorage.setItem(cle, paquet.images[cle]));
    }
    localStorage.setItem('tab-dernier-export', new Date().toISOString());
    vue = 'clients'; clientCourant = null; vehiculeCourant = null;
    render();
    afficherToast('Sauvegarde importée avec succès.', 'succes');
  } catch(e){
    console.error(e);
    afficherToast('Impossible de lire ce fichier de sauvegarde.', 'erreur');
  }
  evt.target.value = '';
}

function animerCompteurs(){
  document.querySelectorAll('.compteur').forEach(el=>{
    const cible = parseFloat(el.dataset.valeur) || 0;
    const duree = 600;
    const debut = performance.now();
    function etape(maintenant){
      const progres = Math.min((maintenant - debut) / duree, 1);
      const valeur = cible * (1 - Math.pow(1 - progres, 3));
      el.textContent = formatEuros(arrondi(valeur)) + ' €';
      if(progres < 1) requestAnimationFrame(etape);
      else el.textContent = formatEuros(cible) + ' €';
    }
    requestAnimationFrame(etape);
  });
}

  const debutJour = today;
  const debutMois = today.slice(0,7) + '-01';
  const debutAnnee = today.slice(0,4) + '-01-01';

  function totauxPeriode(depuis){
    const liste = data.interventions.filter(i=>i.type==='intervention' && i.date && i.date >= depuis);
    const total = liste.reduce((s,i)=>s+totalFiche(i), 0);

  const totalMoisPrecedent = arrondi(data.interventions
    .filter(i=>i.type==='intervention' && i.date && i.date >= debutMoisPrecedent && i.date <= finMoisPrecedent)

function rechercherGlobal(valeur){
  requeteRecherche = valeur;
  if(!valeur.trim()){ renderClients(); return; }
  afficherResultatsRecherche(valeur);
}

function afficherResultatsRecherche(valeur){
  const zone = document.getElementById('zone-resultats');
  if(!zone) return;
  const q = valeur.trim().toLowerCase();
  if(!q){ zone.innerHTML = ''; return; }

  const clientsTrouves = data.clients.filter(c=>
    (c.prenom+' '+c.nom).toLowerCase().includes(q) ||
    (c.telephone||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q));
  const vehiculesTrouves = data.vehicules.filter(v=>
    (v.marque+' '+v.modele).toLowerCase().includes(q) ||
    (v.immatriculation||'').toLowerCase().includes(q));
  const interventionsTrouvees = data.interventions.filter(i=>
    (i.titre||'').toLowerCase().includes(q));

  if(!clientsTrouves.length && !vehiculesTrouves.length && !interventionsTrouvees.length){
    zone.innerHTML = `<div class="vide">Aucun résultat pour « ${esc(valeur)} ».</div>`;
    return;
  }

  let html = '';
  if(clientsTrouves.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Clients</div>`;
    clientsTrouves.forEach(c=>{
      html += `<button type="button" class="dossier" onclick="allerVehicules('${c.id}')">
        <span class="avatar-client" style="background:${couleurAvatar(c.nom+c.prenom)};">${esc((c.prenom[0]||'')+(c.nom[0]||'')).toUpperCase()}</span>
        <div class="info"><div class="titre-d">${esc(c.prenom)} ${esc(c.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  if(vehiculesTrouves.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Véhicules</div>`;
    vehiculesTrouves.forEach(v=>{
      const c = data.clients.find(c=>c.id===v.clientId);
      html += `<button type="button" class="dossier" onclick="allerInterventions('${v.id}')">
        <span class="tab">${esc(v.immatriculation||'—')}</span>
        <div class="info"><div class="titre-d"><span class="pastille-marque" style="background:${couleurMarque(v.marque)};"></span>${esc(v.marque)} ${esc(v.modele)} — ${esc(c?.prenom)} ${esc(c?.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  if(interventionsTrouvees.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Fiches</div>`;
    interventionsTrouvees.forEach(i=>{
      const { v, c } = infosVehicule(i.vehiculeId);
      html += `<button type="button" class="dossier" onclick="allerInterventions('${i.vehiculeId}')">
        <span class="tab">${formatDate(i.date)}</span>
        <div class="info"><div class="titre-d">${esc(i.titre)} — ${esc(v?.marque)} ${esc(v?.modele)}, ${esc(c?.prenom)} ${esc(c?.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  zone.innerHTML = html;
}

      piecesHtml = `<div class="fiche-pieces"><b>${labelPieces}</b><ul style="list-style:none;margin:0;padding:0;">${i.piecesListe.map(p=>{
        const details = [];
        if(p.prixFacture) details.push(`${formatEuros(p.prixFacture)} €${p.margeZero ? ' (coûtant)' : ''}`);
        if(p.heures) details.push(`MO ${p.heures} h (${formatEuros(p.tarifMO)} €)`);
        return `<li style="padding:3px 0;border-bottom:1px dashed var(--border);">
          <div style="display:flex;justify-content:space-between;"><span>${esc(p.nom)}${p.ref ? ` <span style="color:var(--text-muted);font-size:11px;">(réf. ${esc(p.ref)})</span>` : ''}</span></div>
          ${details.length ? `<div style="text-align:right;font-size:12px;color:var(--text-muted);">${details.join(' · ')}</div>` : ''}
        </li>`;
      }).join('')}</ul></div>`;
    } else if(i.pieces){
      piecesHtml = `<div class="fiche-pieces"><b>${labelPieces}</b>${esc(i.pieces)}</div>`;
    }
    let tarifsHtml = '';
    const tarifs = [];
    if(i.heuresMO) tarifs.push(`<span>Main d'œuvre&nbsp;: <b>${esc(i.heuresMO)} h → ${formatEuros(i.tarifMO)} €</b></span>`);
    if(i.prixAchatPieces) tarifs.push(`<span>Pièces&nbsp;: <b>${formatEuros(i.coutPieces)} €</b> (achat ${esc(i.prixAchatPieces)} €)</span>`);
    const tf = totalFiche(i);
    if(tf > 0) tarifs.push(`<span class="total">Total&nbsp;: <b>${formatEuros(tf)} €</b></span>`);
    if(i.acompte > 0){
      const solde = arrondi(tf - i.acompte);
      const soldeNegatif = solde < 0;
      tarifs.push(`<span>Acompte versé&nbsp;: <b>${formatEuros(i.acompte)} €</b></span>`);
      tarifs.push(`<span>${soldeNegatif ? 'Trop-perçu' : 'Solde restant'}&nbsp;: <b style="${soldeNegatif ? `color:var(--danger);` : ''}">${formatEuros(Math.abs(solde))} €</b></span>`);
    }
    if(tarifs.length) tarifsHtml = `<div class="fiche-tarifs">${tarifs.join('')}</div>`;
    let paiementHtml = '';
    if(i.type === 'intervention' && tf > 0){
      const paye = i.statutPaiement === 'paye';
      paiementHtml = `<div class="paiement-toggle"><button type="button" class="badge ${paye?'paye':'non_paye'}" onclick="basculerPaiement('${i.id}')">${paye?'Payé':'Non payé'}</button></div>`;
    }
    let statutHtml = '';
    if(i.type === 'devis'){
      const statut = i.statutDevis || 'en_attente';
      const libelles = { en_attente:'En attente', valide:'Validé', refuse:'Refusé' };
      statutHtml = `<div class="statut-select">` + Object.keys(libelles).map(s=>
        `<button type="button" class="statut-opt ${s}${s===statut?' actif':''}" onclick="changerStatutDevis('${i.id}','${s}')">${libelles[s]}</button>`
      ).join('') + `</div>`;
      if(statut === 'valide'){
        statutHtml += `<div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="discret commande-btn" onclick="basculerPiecesCommandees('${i.id}')">${i.piecesCommandees ? '✓ Pièces commandées' : 'Marquer pièces commandées'}</button>
          <button class="discret commande-btn" onclick="transformerEnIntervention('${i.id}')">Transformer en intervention</button>
        </div>`;
      }
    }
    fiche.innerHTML = `
      <div class="fiche-top">
        <div class="fiche-titre-ligne">
          <span class="badge ${i.type === 'devis' ? 'devis' : 'intervention'}">${i.type === 'devis' ? 'Devis' : 'Intervention'}</span>
          <span class="fiche-titre">${esc(i.titre)}</span>
        </div>
        <div class="fiche-date-actions">
          <span class="fiche-date">${formatDate(i.date)}${i.km ? `<span class="km">${esc(i.km)} km</span>` : ''}</span>
          <button class="bouton-icone" title="Modifier" onclick="ouvrirEditionIntervention('${i.id}')">✎</button>
          <button class="bouton-icone danger" title="Supprimer">✕</button>
        </div>
      </div>
      ${piecesHtml}
      ${tarifsHtml}
      ${paiementHtml}
      ${statutHtml}
      ${defautsHtml}
      <div class="bloc-titre" id="pj-titre-${i.id}" style="display:none;">Pièces jointes</div>
      <div class="pieces-jointes" id="pj-${i.id}"></div>
      <div class="fiche-actions-bas">
        <button class="primaire" onclick="imprimerFiche('${i.id}')">📄 Exporter en PDF</button>
        <div class="conteneur-menu-fiche">
          <button class="secondaire" onclick="basculerMenuFiche('${i.id}')" title="Plus d'actions">⋯</button>
          <div class="menu-fiche" id="menu-fiche-${i.id}" style="display:none;">
            <button onclick="dupliquerFiche('${i.id}'); basculerMenuFiche('${i.id}');">⧉ Dupliquer</button>
            ${i.date ? `<button onclick="ouvrirGoogleAgendaParId('${i.id}'); basculerMenuFiche('${i.id}');">📅 Ajouter à Google Agenda</button>` : ''}
          </div>
        </div>
      </div>
    `;
    fiche.querySelector('button[title="Supprimer"]').addEventListener('click', async ()=>{
      if(!(await confirmerAction(`Supprimer définitivement la fiche "${i.titre}" ? Les documents joints seront aussi supprimés. Cette action est irréversible.`))) return;
      if(i.facturePhoto) await supprimerImg(i.id+':facture');
      (i.factures||[]).forEach(async (_,idx)=>await supprimerImg(i.id+':facture:'+idx));
      (i.controles||[]).forEach(async (_,idx)=>await supprimerImg(i.id+':ct:'+idx));
      data.interventions = data.interventions.filter(x=>x.id!==i.id);
      await sauvegarder();
      render();
    });
    ficheZone.appendChild(fiche);
    await renderPiecesJointes(i);
  });
}

async function renderPiecesJointes(i){
  const cont = document.getElementById('pj-'+i.id);
  const titreEl = document.getElementById('pj-titre-'+i.id);
  if(!cont) return;
  let any = false;
  if(i.facturePhoto){
    const url = await chargerImg(i.id+':facture');
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Document')); }
  }
  for(let idx=0; idx<(i.factures||[]).length; idx++){
    const url = await chargerImg(i.id+':facture:'+idx);
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Document')); }
  }
  for(let idx=0; idx<(i.controles||[]).length; idx++){
    const url = await chargerImg(i.id+':ct:'+idx);
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Contrôle technique')); }
  }
  if(any) titreEl.style.display = 'block';
}

function telechargerFichier(dataUrl, nomFichier){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = nomFichier;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function ouvrirLightbox(dataUrl){
  const overlay = document.getElementById('lightbox');
  overlay.innerHTML = `
    <img src="${dataUrl}" style="max-width:92vw;max-height:80vh;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.3);">
    <button class="primaire" onclick="fermerLightbox()">Fermer</button>
  `;
  overlay.style.display = 'flex';
}
function fermerLightbox(){
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox').innerHTML = '';
}

function creerVignette(dataUrl, label){
  let el;
  const estImage = dataUrl.startsWith('data:image');
  if(estImage){
    el = document.createElement('img');
    el.className = 'vignette';
    el.src = dataUrl;
    el.title = label;
    el.addEventListener('click', ()=>ouvrirLightbox(dataUrl));
  } else {
    el = document.createElement('div');
    el.className = 'vignette-doc';
    el.textContent = label + ' (PDF) — télécharger';
    el.addEventListener('click', ()=>telechargerFichier(dataUrl, label.replace(/\s+/g,'-').toLowerCase() + '.pdf'));
  }
  return el;
}

async function ouvrirEditionIntervention(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  interventionEnEdition = id;
  piecesJointesTemp = { factures: [], controles: [] };
  document.getElementById('form-intervention-titre').textContent = 'Modifier la fiche';
  document.getElementById('form-intervention').classList.add('ouvert');
  document.getElementById('i-titre').value = i.titre || '';
  peuplerListeCatalogue();
  document.getElementById('suggestion-catalogue').style.display = 'none';
  document.getElementById('i-date').value = i.date || '';
  document.getElementById('i-km').value = i.km || '';
  document.getElementById('i-acompte').value = i.acompte || '';
  choisirType(i.type || 'intervention');
  if(i.type === 'devis') choisirStatutDevis(i.statutDevis || 'en_attente');

  document.getElementById('pieces-lignes').innerHTML = '';
  if(i.piecesListe && i.piecesListe.length){
    i.piecesListe.forEach(p=>ajouterLignePiece(p.nom, p.ref, p.prixAchat, p.heures, p.margeZero !== undefined ? p.margeZero : i.margeZero));
  } else if(i.prixAchatPieces || i.heuresMO){
    ajouterLignePiece(i.pieces || 'Pièces', '', i.prixAchatPieces, i.heuresMO, i.margeZero);
  } else {
    ajouterLignePiece();
  }
  calculerApercus();

  document.getElementById('defauts-lignes').innerHTML = '';
  if(i.defauts && i.defauts.length){
    i.defauts.forEach(d=>{
      ajouterLigneDefaut();
      const inputs = document.querySelectorAll('#defauts-lignes input');
      inputs[inputs.length-1].value = d;
    });
  } else {
    ajouterLigneDefaut();
  }

  document.getElementById('apercu-facture').innerHTML = '';
  document.getElementById('apercu-ct').innerHTML = '';
  if(i.facturePhoto){
    const url = await chargerImg(id+':facture');
    if(url){

      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Document existant'));
      document.getElementById('apercu-facture').appendChild(item);
    }
  }
  for(let idx=0; idx<(i.factures||[]).length; idx++){
    const url = await chargerImg(id+':facture:'+idx);
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Document existant'));
      document.getElementById('apercu-facture').appendChild(item);
    }
  }
  for(let idx=0; idx<(i.controles||[]).length; idx++){
    const url = await chargerImg(id+':ct:'+idx);
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Contrôle technique actuel'));
      document.getElementById('apercu-ct').appendChild(item);
    }
  }
}

function arrondi(n){ return Math.round(n*100)/100; }

function ajouterLignePiece(nom, ref, prixAchat, heures, margeZero){
  const cont = document.getElementById('pieces-lignes');
  const carte = document.createElement('div');
  carte.className = 'piece-carte';
  carte.dataset.marge = margeZero ? 'zero' : 'normale';
  carte.innerHTML = `
    <div class="piece-entete">
      <input type="text" class="piece-nom" placeholder="Nom de la pièce" value="${nom ? esc(nom) : ''}">
      <button type="button" class="discret" onclick="this.closest('.piece-carte').remove(); calculerApercus();">✕</button>
    </div>
    <div class="piece-champs">
      <div class="champ"><label>Référence</label><input type="text" class="piece-ref" placeholder="Réf." value="${ref ? esc(ref) : ''}"></div>
      <div class="champ"><label>Prix d'achat €</label><input type="number" class="piece-prix" placeholder="0" value="${prixAchat ? esc(String(prixAchat)) : ''}" oninput="calculerApercus()"></div>
      <div class="champ"><label>Main d'œuvre (h)</label><input type="number" step="0.25" class="piece-heures" placeholder="0" value="${heures ? esc(String(heures)) : ''}" oninput="calculerApercus()"></div>
    </div>
    <div class="piece-marge-select">
      <button type="button" class="marge-mini-opt ${margeZero ? '' : 'actif'}" data-marge="normale" onclick="choisirMargePiece(this,'normale')">Marge ${Math.round((data.reglages.margePieces||0)*100)}%</button>
      <button type="button" class="marge-mini-opt ${margeZero ? 'actif' : ''}" data-marge="zero" onclick="choisirMargePiece(this,'zero')">Prix coûtant</button>
    </div>
    <div class="piece-sous-total"></div>
  `;
  cont.appendChild(carte);
  calculerApercus();
}

function choisirMargePiece(bouton, type){
  const carte = bouton.closest('.piece-carte');
  carte.dataset.marge = type;
  carte.querySelectorAll('.marge-mini-opt').forEach(b=>b.classList.toggle('actif', b.dataset.marge===type));
  calculerApercus();
}

function calculerApercus(){
  let totalAchat = 0, totalFacture = 0, totalHeures = 0, totalMO = 0;
  document.querySelectorAll('#pieces-lignes .piece-carte').forEach(carte=>{
    const margeAppliquee = carte.dataset.marge === 'zero' ? 0 : (data.reglages.margePieces||0);
    const prix = parseFloat(carte.querySelector('.piece-prix').value);
    const heures = parseFloat(carte.querySelector('.piece-heures').value);
    const sousTotal = carte.querySelector('.piece-sous-total');
    const parties = [];
    if(prix > 0){
      const facture = arrondi(prix * (1 + margeAppliquee));
      parties.push(`Pièce&nbsp;: ${formatEuros(facture)} €`);
      totalAchat += prix; totalFacture += facture;
    }
    if(heures > 0){
      const tarifLigne = arrondi(heures * data.reglages.tauxHoraire);
      parties.push(`MO&nbsp;: ${formatEuros(tarifLigne)} €`);
      totalHeures += heures; totalMO += tarifLigne;
    }
    sousTotal.innerHTML = parties.join(' · ');
  });
  const apercuPieces = document.getElementById('apercu-pieces');
  const apercuMO = document.getElementById('apercu-mo');
  apercuPieces.textContent = totalFacture > 0 ? `Total pièces facturées : ${formatEuros(arrondi(totalFacture))} €` : '';
  apercuMO.textContent = totalMO > 0 ? `Total main d'œuvre : ${totalHeures} h → ${formatEuros(arrondi(totalMO))} €` : '';
}

    retirer.onclick = ()=>{ piecesJointesTemp.factures[idx] = null; item.remove(); };
    item.appendChild(retirer);
    cont.appendChild(item);
  }
}

function sautDePageSiNecessaire(doc, y){
  if(y > 275){ doc.addPage(); return 20; }
  return y;
}

function imprimerReleveVehicule(vehiculeId){
  const { v, c } = infosVehicule(vehiculeId);
  const interventions = data.interventions
    .filter(i=>i.vehiculeId===vehiculeId && i.type==='intervention')
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!interventions.length){
    afficherToast('Aucune intervention facturée pour ce véhicule pour le moment.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 32;
  dessinerLogoPdf(doc);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text("Relevé d'entretien", 14, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(148,138,121);
  doc.text(`Édité le ${formatDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 10;
  doc.setTextColor(43,38,31); doc.setFontSize(11);
  doc.text(`Client : ${c?.prenom||''} ${c?.nom||''}`, 14, y); y += 7;
  doc.text(`Véhicule : ${v?.marque||''} ${v?.modele||''}${v?.immatriculation ? ' — '+v.immatriculation : ''}`, 14, y); y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Date', 14, y); doc.text('Intervention', 45, y); doc.text('Montant', 196, y, { align: 'right' });
  y += 3; doc.setDrawColor(231,222,205); doc.line(14, y, 196, y); y += 6;
  doc.setFont('helvetica','normal');
  interventions.forEach(i=>{
    y = sautDePageSiNecessaire(doc, y);
    doc.text(formatDate(i.date), 14, y);
    const titreLignes = doc.splitTextToSize(i.titre||'', 130);
    doc.text(titreLignes, 45, y);
    doc.text(`${formatEuros(totalFiche(i))} €`, 196, y, { align: 'right' });
    y += Math.max(titreLignes.length,1)*6 + 2;
  });
  y += 4; doc.setDrawColor(231,222,205); doc.line(14, y, 196, y); y += 9;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(`Total : ${formatEuros(totalVehicule(vehiculeId))} €`, 196, y, { align: 'right' });
  doc.save(`releve-${(v?.marque||'')}-${(v?.modele||'')}.pdf`.replace(/\s+/g,'-').toLowerCase());
}

function imprimerReleveClient(clientId){
  const c = data.clients.find(c=>c.id===clientId);
  const vehicules = data.vehicules.filter(v=>v.clientId===clientId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 32;
  dessinerLogoPdf(doc);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text("Relevé d'entretien", 14, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(148,138,121);
  doc.text(`Édité le ${formatDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 10;
  doc.setTextColor(43,38,31); doc.setFontSize(11);
  doc.text(`Client : ${c?.prenom||''} ${c?.nom||''}`, 14, y); y += 10;

  let uneSection = false;
  vehicules.forEach(v=>{
    const interventions = data.interventions
      .filter(i=>i.vehiculeId===v.id && i.type==='intervention')
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

    uneSection = true;
    y = sautDePageSiNecessaire(doc, y);
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(`${v.marque} ${v.modele}${v.immatriculation ? ' — '+v.immatriculation : ''}`, 14, y); y += 7;
    doc.setFontSize(10);
    doc.text('Date', 14, y); doc.text('Intervention', 45, y); doc.text('Montant', 196, y, { align: 'right' });
    y += 3; doc.setDrawColor(231,222,205); doc.line(14, y, 196, y); y += 6;
    doc.setFont('helvetica','normal');
    interventions.forEach(i=>{
      y = sautDePageSiNecessaire(doc, y);
      doc.text(formatDate(i.date), 14, y);
      const titreLignes = doc.splitTextToSize(i.titre||'', 130);
      doc.text(titreLignes, 45, y);
      doc.text(`${formatEuros(totalFiche(i))} €`, 196, y, { align: 'right' });
      y += Math.max(titreLignes.length,1)*6 + 2;
    });
    doc.setFont('helvetica','bold');
    doc.text(`Sous-total : ${formatEuros(totalVehicule(v.id))} €`, 196, y, { align: 'right' });
    y += 12;
  });

  if(!uneSection){
    afficherToast('Aucune intervention facturée pour ce client pour le moment.');
    return;
  }

  y = sautDePageSiNecessaire(doc, y);
  doc.setFontSize(14);
  doc.text(`Total général : ${formatEuros(totalClient(clientId))} €`, 196, y, { align: 'right' });
  doc.save(`releve-${(c?.prenom||'')}-${(c?.nom||'')}.pdf`.replace(/\s+/g,'-').toLowerCase());
}

function ouvrirGoogleAgendaParId(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  const { v, c } = infosVehicule(i.vehiculeId);
  ouvrirGoogleAgenda(i, c, v);

function ouvrirGoogleAgenda(intervention, client, vehicule){
  const debut = dateVersICS(intervention.date, 0);
  const fin = dateVersICS(intervention.date, 1);
  const resume = `${intervention.type === 'devis' ? 'Devis' : 'Intervention'} — ${intervention.titre}`;
  const description = `${vehicule ? vehicule.marque + ' ' + vehicule.modele : ''}${vehicule?.immatriculation ? ' (' + vehicule.immatriculation + ')' : ''}${client ? ' — client : ' + client.prenom + ' ' + client.nom : ''}`;
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(resume)
    + '&dates=' + debut + '/' + fin
    + '&details=' + encodeURIComponent(description);
  window.open(url, '_blank');
}

  doc.text('T', 19.5, 18, { align: 'center' });
