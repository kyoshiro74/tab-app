<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B1917">
<title>TAB — Dossiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F2F1ED; --surface:#FFFFFF; --surface-2:#F6F5F1;
    --accent:#3D6472; --steel:#93A7AD;
    --text:#31302C; --text-muted:#8A8781; --danger:#B85C4E; --success:#5C8A6A; --border:#E2E0D8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .app{max-width:900px;margin:0 auto;padding:26px 18px 60px;}
  header.top{border-bottom:2px solid var(--border);padding-bottom:14px;margin-bottom:18px;}
  header.top h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;margin:0;letter-spacing:.4px;}
  header.top p{margin:2px 0 0;color:var(--text-muted);font-size:12.5px;}

  .fil{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);margin-bottom:18px;}
  .fil span.sep{color:var(--border);}
  .fil button.lien{background:none;border:none;color:var(--steel);font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}
  .fil button.lien:hover{color:var(--accent);}
  .fil .courant{color:var(--text);}

  .panneau-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .panneau-header h2{font-family:'Oswald',sans-serif;font-size:19px;margin:0;font-weight:600;}
  .panneau-header .sous{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .ct-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-bottom:16px;}
  .ct-info b{color:var(--text);font-weight:500;}
  .ct-info.retard b{color:var(--danger);}
  .ct-info button.discret{padding:2px 4px;}

  .alerte{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;background:var(--surface);padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(62,54,44,0.05);}
  .alerte.rouge{border-left-color:var(--danger);}
  .alerte-titre{font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:var(--text);margin-bottom:8px;}
  .alerte-ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px;}
  .alerte-ligne:first-of-type{border-top:none;}
  .alerte-ligne .desc{color:var(--text);cursor:pointer;}
  .alerte-ligne .desc b{color:var(--accent);font-weight:600;}
  .alerte-ligne .desc:hover{text-decoration:underline;}
  .alerte-ligne .quand{color:var(--text-muted);white-space:nowrap;margin-left:8px;}

  .statut-select{display:inline-flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
  .statut-opt{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);cursor:pointer;color:var(--text-muted);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);box-shadow:0 1px 0 rgba(62,54,44,0.06);transition:all .12s ease;}
  .statut-opt.actif{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(62,54,44,0.14);}
  .statut-opt.actif.en_attente{border-color:var(--steel);color:#5F767D;background:rgba(147,167,173,0.16);}
  .statut-opt.actif.valide{border-color:var(--success);color:#5C7D50;background:rgba(132,163,119,0.18);}
  .statut-opt.actif.refuse{border-color:var(--danger);color:#A5573F;background:rgba(193,122,99,0.18);}
  .commande-btn{font-size:11px;padding:4px 9px;margin-top:6px;}

  .recherche-zone{margin-bottom:16px;}
  .recherche-zone input{font-size:14px;}
  .resultat-groupe{margin-bottom:14px;}
  .resultat-groupe-titre{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}

  .badge.paye{background:rgba(132,163,119,0.16);color:#5C7D50;}
  .badge.non_paye{background:rgba(193,122,99,0.16);color:#A5573F;}
  .paiement-toggle{margin:6px 0;}

  .total-ligne{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .total-ligne b{color:var(--accent);font-weight:600;}
  .fiche-tarifs .total{color:var(--accent);font-weight:600;}

  .barre-outils{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .barre-outils button{font-size:12px;padding:7px 12px;}
  input[type="file"].cache{display:none;}

  .pastille-cloche{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10.5px;line-height:18px;text-align:center;font-family:'Inter',sans-serif;font-weight:600;padding:0 2px;}
  #panneau-notifs{margin-bottom:14px;animation:apparitionPanneau .15s ease;}
  @keyframes apparitionPanneau{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

  .stats-periodes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
  @media (min-width:700px){.stats-periodes{grid-template-columns:repeat(4,1fr);}}
  .stat-carte{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;box-shadow:0 1px 3px rgba(62,54,44,0.05);}
  .stat-titre{font-family:'Oswald',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:4px;}
  .stat-nb{font-size:11px;color:var(--text-muted);}
  .stat-montant{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--text);margin-top:2px;}
  .stat-marge{font-size:11.5px;color:var(--accent);margin-top:1px;}

  .fiche-actions-bas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .fiche-actions-bas button{font-size:11.5px;padding:6px 10px;}

  #zone-impression{display:none;}
  @media print{
    body > *{display:none !important;}
    #zone-impression{display:block !important;position:absolute;top:0;left:0;width:100%;}
  }

  button{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.2px;border-radius:8px;border:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);color:var(--text);padding:9px 14px;cursor:pointer;font-size:13px;box-shadow:0 2px 0 rgba(62,54,44,0.07),0 1px 3px rgba(62,54,44,0.06);transition:all .12s ease;}
  button:active{transform:translateY(1px);box-shadow:0 0 0 rgba(62,54,44,0),inset 0 1px 3px rgba(62,54,44,0.1);}
  button.primaire{background:linear-gradient(180deg,#4C7987 0%,var(--accent) 100%);border-color:#2D4E59;color:#FFFFFF;box-shadow:0 2px 0 rgba(28,50,58,0.35),0 2px 5px rgba(28,50,58,0.18);}
  button.primaire:hover{background:linear-gradient(180deg,#537F8D 0%,#3D6472 100%);}
  button.primaire:active{box-shadow:inset 0 1px 4px rgba(90,55,20,0.35);}
  button.discret{background:none;border:none;color:var(--text-muted);padding:4px 6px;font-family:'Inter',sans-serif;font-size:12px;box-shadow:none;}
  button.discret:active{box-shadow:none;transform:none;}
  button.discret:hover{color:var(--danger);}

  input, textarea, select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;border-radius:7px;padding:9px 10px;width:100%;}
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  textarea{resize:vertical;min-height:56px;}

  .dossier{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:9px;cursor:pointer;box-shadow:0 3px 0 rgba(62,54,44,0.05),0 2px 6px rgba(62,54,44,0.07);transition:all .12s ease;width:100%;text-align:left;font-family:'Inter',sans-serif;}
  .dossier:hover{box-shadow:0 4px 0 rgba(62,54,44,0.06),0 4px 12px rgba(62,54,44,0.1);transform:translateY(-1px);}
  .dossier:active{box-shadow:inset 0 2px 4px rgba(62,54,44,0.12);transform:translateY(2px);}
  .dossier .tab{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;background:var(--accent);color:#FFF8F0;border-radius:5px;padding:4px 8px;white-space:nowrap;}
  .dossier .info{flex:1;min-width:0;}
  .dossier .titre-d{font-size:14px;color:var(--text);}
  .dossier .sous-info{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .dossier .compte{font-size:11px;color:var(--text-muted);white-space:nowrap;}

  .vide{border:1px dashed var(--border);border-radius:6px;padding:36px 18px;text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:14px;}

  .formulaire{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:18px;display:none;}
  .formulaire.ouvert{display:block;}
  .formulaire h3{font-family:'Oswald',sans-serif;font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .grille.trois{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:520px){.grille, .grille.trois{grid-template-columns:1fr 1fr;}}
  @media (max-width:400px){.grille, .grille.trois{grid-template-columns:1fr;}}
  .champ{display:flex;flex-direction:column;gap:5px;}
  .champ label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
  .champ.large{grid-column:1/-1;}
  .champ-titre-grand{font-size:17px;padding:13px 14px;font-weight:500;}
  .champ .apercu-calcul{font-size:12px;color:var(--accent);margin-top:2px;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .erreur{color:var(--danger);font-size:12px;margin:-4px 0 8px;}

  .type-select{display:flex;gap:8px;margin-bottom:12px;}
  .type-opt{flex:1;border:1px solid var(--border);border-radius:7px;padding:9px;text-align:center;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.3px;color:var(--text-muted);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);box-shadow:0 2px 0 rgba(62,54,44,0.06),0 1px 2px rgba(62,54,44,0.05);transition:all .12s ease;}
  .type-opt.actif{border-color:var(--accent);color:#2D4E59;background:linear-gradient(180deg,rgba(61,100,114,0.16) 0%,rgba(61,100,114,0.09) 100%);box-shadow:inset 0 2px 4px rgba(28,50,58,0.16);transform:translateY(1px);}

  .defaut-ligne{display:flex;gap:6px;margin-bottom:6px;}
  .defaut-ligne input{flex:1;}
  .btn-ajout-ligne{align-self:flex-start;font-size:12px;padding:6px 10px;margin-top:2px;}

  .piece-carte{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 10px 8px;margin-bottom:8px;}
  .piece-carte .piece-entete{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .piece-carte .piece-nom{flex:1;}
  .piece-champs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media (max-width:480px){.piece-champs{grid-template-columns:1fr 1fr;}}
  .piece-champs .champ label{font-size:10px;}
  .piece-sous-total{text-align:right;font-size:11.5px;color:var(--accent);margin-top:6px;}

  .fiche{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px 17px 13px;margin-bottom:15px;box-shadow:0 1px 3px rgba(62,54,44,0.05);}
  .fiche::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background-image:radial-gradient(circle,var(--surface-2) 1.5px,transparent 1.5px);background-size:8px 1px;}
  .fiche-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .fiche-titre-ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.4px;padding:3px 8px;border-radius:5px;transition:all .12s ease;border:none;box-shadow:none;}
  .paiement-toggle .badge{box-shadow:0 2px 0 rgba(62,54,44,0.06);}
  .paiement-toggle .badge:active{box-shadow:inset 0 1px 3px rgba(62,54,44,0.15);transform:translateY(1px);}
  .badge.intervention{background:rgba(61,100,114,0.14);color:#2D4E59;}
  .badge.devis{background:rgba(147,167,173,0.16);color:#5F767D;}
  .fiche-titre{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--text);}
  .fiche-date{font-size:12px;color:var(--text-muted);white-space:nowrap;text-align:right;}
  .fiche-date-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .bouton-icone{font-family:'Inter',sans-serif;font-size:13px;line-height:1;padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);color:var(--text-muted);box-shadow:0 2px 0 rgba(62,54,44,0.06),0 1px 2px rgba(62,54,44,0.05);transition:all .12s ease;cursor:pointer;}
  .bouton-icone:hover{color:var(--accent);border-color:var(--accent);}
  .bouton-icone:active{box-shadow:inset 0 1px 3px rgba(62,54,44,0.12);transform:translateY(1px);}
  .bouton-icone.danger:hover{color:var(--danger);border-color:var(--danger);}
  .fiche-date .km{display:block;color:var(--text-muted);}
  .fiche-pieces{font-size:13px;line-height:1.5;margin:4px 0 10px;color:var(--text);}
  .fiche-pieces b{color:var(--text-muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px;}

  .fiche-tarifs{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin:8px 0;}
  .fiche-tarifs b{color:var(--text);font-weight:500;}

  .bloc-titre{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 6px;border-top:1px solid var(--border);padding-top:9px;}
  .defauts-liste{list-style:none;margin:0;padding:0;font-size:13px;}
  .defauts-liste li{padding:3px 0 3px 14px;position:relative;}
  .defauts-liste li::before{content:"—";position:absolute;left:0;color:var(--danger);}

  .pieces-jointes{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .vignette{width:64px;height:64px;border-radius:8px;border:1px solid var(--border);object-fit:cover;cursor:pointer;background:var(--surface-2);box-shadow:0 2px 0 rgba(62,54,44,0.06),0 2px 5px rgba(62,54,44,0.08);transition:all .12s ease;}
  .vignette:active{box-shadow:inset 0 2px 4px rgba(62,54,44,0.15);transform:translateY(1px);}
  .vignette-doc{width:64px;height:64px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted);text-align:center;cursor:pointer;box-shadow:0 2px 0 rgba(62,54,44,0.06),0 2px 5px rgba(62,54,44,0.08);transition:all .12s ease;}
  .vignette-doc:active{box-shadow:inset 0 2px 4px rgba(62,54,44,0.15);transform:translateY(1px);}

  .fiche-actions{position:absolute;top:11px;right:11px;}
  .upload-label{display:inline-block;font-size:12px;padding:8px 12px;border:1px dashed var(--border);border-radius:7px;color:var(--text-muted);cursor:pointer;text-align:center;transition:all .12s ease;}
  .upload-label:hover{border-color:var(--accent);color:var(--accent);}
  .upload-label:active{transform:translateY(1px);}
  .apercus{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .apercu-item{position:relative;}
  .apercu-item .retirer{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer;border:none;padding:0;}

<script>
const CLE = 'tab-data';

const firebaseConfig = {
  apiKey: "AIzaSyDdFLSVCLiqTTvDg8A3eXTUhIOEH0TzYA4",
  authDomain: "tab-garage.firebaseapp.com",
  projectId: "tab-garage",
  storageBucket: "tab-garage.firebasestorage.app",
  messagingSenderId: "469529015",
  appId: "1:469529015:web:567282402d7a9975b5b832"
};
let firebaseDb = null;
try{
  firebase.initializeApp(firebaseConfig);
  firebaseDb = firebase.firestore();
} catch(e){ console.error('Firebase indisponible', e); }

function fusionnerListe(listeLocale, listeDistante){
  const map = new Map();
  (listeDistante||[]).forEach(item=>map.set(item.id, item));
  (listeLocale||[]).forEach(item=>{
    const existant = map.get(item.id);
    if(!existant || (item._maj||0) >= (existant._maj||0)) map.set(item.id, item);
  });
  return Array.from(map.values());
}
function fusionnerDonnees(local, distant){
  if(!distant) return local;
  if(!local) return distant;
  return {
    clients: fusionnerListe(local.clients, distant.clients),
    vehicules: fusionnerListe(local.vehicules, distant.vehicules),
    interventions: fusionnerListe(local.interventions, distant.interventions),
    reglages: (local.dernierMaj||0) >= (distant.dernierMaj||0) ? (local.reglages||{}) : (distant.reglages||{}),
    dernierMaj: Math.max(local.dernierMaj||0, distant.dernierMaj||0)
  };
}

async function recupererDepuisFirebase(code){
  if(!firebaseDb) return null;
  try{
    const doc = await firebaseDb.collection('garages').doc(code).get();
    return doc.exists ? doc.data() : null;
  } catch(e){ console.error('Erreur de lecture Firebase', e); return null; }
}

async function synchroniserVersFirebase(){
  const code = localStorage.getItem('tab-code-sync');
  if(!code || !firebaseDb) return;
  try{
    await firebaseDb.collection('garages').doc(code).set(data);
  } catch(e){ console.error('Erreur de synchronisation', e); }
}

let annulerEcouteSynchro = null;
function demarrerEcouteSynchro(code){
  if(!firebaseDb || !code) return;
  if(annulerEcouteSynchro){ annulerEcouteSynchro(); annulerEcouteSynchro = null; }
  annulerEcouteSynchro = firebaseDb.collection('garages').doc(code).onSnapshot(doc=>{
    if(!doc.exists) return;
    if(doc.metadata.hasPendingWrites) return;
    const distant = doc.data();
    const fusion = fusionnerDonnees(data, distant);
    const inchange = JSON.stringify(fusion) === JSON.stringify(data);
    if(inchange) return;
    data = fusion;
    try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
    if(document.getElementById('verrou').style.display !== 'flex'){
      render();
    }
    const versDistant = JSON.stringify(distant) !== JSON.stringify(data);
    if(versDistant) synchroniserVersFirebase();
  }, err=>console.error('Erreur d\'écoute Firebase', err));
}
function arreterEcouteSynchro(){
  if(annulerEcouteSynchro){ annulerEcouteSynchro(); annulerEcouteSynchro = null; }
}

let data = { clients: [], vehicules: [], interventions: [], reglages: { tauxHoraire: 55, margePieces: 0.20, pin: null } };
let vue = 'clients';
let clientCourant = null;
let vehiculeCourant = null;

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function formatDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function tempsRelatif(iso){
  if(!iso) return '';
  const jours = Math.floor((Date.now() - new Date(iso+'T00:00:00').getTime()) / 86400000);
  if(jours < 0) return formatDate(iso) + ' (à venir)';
  if(jours === 0) return "aujourd'hui";
  if(jours === 1) return 'hier';
  if(jours < 30) return `il y a ${jours} jours`;
  const mois = Math.floor(jours/30);
  if(mois < 12) return `il y a ${mois} mois`;
  const ans = Math.floor(mois/12);
  return `il y a ${ans} an${ans>1?'s':''}`;
}

async function charger(){
  try{
    const val = localStorage.getItem(CLE);
    if(val) data = JSON.parse(val);
  } catch(e){ /* pas de données encore */ }
  if(!data.reglages) data.reglages = { tauxHoraire: 55, margePieces: 0.20, pin: null };
  if(data.reglages.tauxHoraire === undefined) data.reglages.tauxHoraire = 55;
  if(data.reglages.margePieces === undefined) data.reglages.margePieces = 0.20;

  const codeSync = localStorage.getItem('tab-code-sync');
  if(codeSync){
    const distant = await recupererDepuisFirebase(codeSync);
    if(distant){
      const fusion = fusionnerDonnees(data, distant);
      const localModifie = JSON.stringify(fusion) !== JSON.stringify(data);
      data = fusion;
      try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
      if(localModifie) synchroniserVersFirebase();
    }
    demarrerEcouteSynchro(codeSync);
  }

  if(data.reglages.pin){
    document.getElementById('app-principal').style.display = 'none';
    document.getElementById('verrou').style.display = 'flex';
  } else {
    render();
    verifierRappelPieces();
    verifierSauvegardeAuto();
  }
}
function verifierSauvegardeAuto(){
  if(data.reglages.sauvegardeAutoActive === false) return;
  if(!data.clients.length && !data.vehicules.length) return;
  const dernier = localStorage.getItem('tab-dernier-export');
  const jours = dernier ? Math.floor((Date.now() - new Date(dernier).getTime()) / 86400000) : null;
  if(jours === null || jours >= 7){
    exporterSauvegarde();
  }
}
function verifierRappelPieces(){
  if(!data.reglages.rappelsActifs) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const aujourdhui = new Date().toISOString().slice(0,10);
  if(localStorage.getItem('tab-dernier-rappel-pieces') === aujourdhui) return;
  const enAttente = data.interventions.filter(i=>i.type==='devis' && i.statutDevis==='valide' && !i.piecesCommandees);
  if(!enAttente.length) return;
  try{
    new Notification('TAB — Pièces à commander', {
      body: `${enAttente.length} devis validé${enAttente.length>1?'s':''} en attente de commande de pièces.`
    });
  } catch(e){}
  localStorage.setItem('tab-dernier-rappel-pieces', aujourdhui);
}
function verifierPin(){
  const saisie = document.getElementById('pin-saisie').value.trim();
  if(saisie && saisie === data.reglages.pin){
    document.getElementById('verrou').style.display = 'none';
    document.getElementById('app-principal').style.display = 'block';
    document.getElementById('pin-erreur').style.display = 'none';
    render();
  } else {
    document.getElementById('pin-erreur').style.display = 'block';
  }
}
async function sauvegarder(){
  data.dernierMaj = Date.now();
  try{ localStorage.setItem(CLE, JSON.stringify(data)); }
  catch(e){ console.error('Erreur de sauvegarde (mémoire du téléphone pleine ?)', e); alert('Espace de stockage insuffisant sur ce téléphone. Essayez de supprimer une photo jointe volumineuse.'); }
  synchroniserVersFirebase();
}
async function sauvegarderImg(id, dataUrl){
  try{ localStorage.setItem('img:'+id, dataUrl); }
  catch(e){ console.error(e); alert('Impossible d\'enregistrer cette image (espace de stockage insuffisant).'); }
}
async function chargerImg(id){
  try{ return localStorage.getItem('img:'+id); }
  catch(e){ return null; }
}
async function supprimerImg(id){
  try{ localStorage.removeItem('img:'+id); } catch(e){}
}

function fichierVersBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('lecture échouée'));
    r.readAsDataURL(file);
  });
}

function render(){
  renderFil();
  if(vue === 'clients') renderClients();
  else if(vue === 'vehicules') renderVehicules();
  else if(vue === 'interventions') renderInterventions();
  else if(vue === 'reglages') renderReglages();
}
function allerReglages(){ vue='reglages'; render(); }

      ? `<span class="courant">${esc(c?.prenom)} ${esc(c?.nom)}</span>`

async function enregistrerReglagesTarifs(){
  const taux = parseFloat(document.getElementById('r-taux').value);
  const marge = parseFloat(document.getElementById('r-marge').value);
  const err = document.getElementById('r-erreur');
  if(!(taux > 0) || isNaN(marge) || marge < 0){
    err.textContent = 'Merci de renseigner un taux horaire et une marge valides.';
    err.style.display = 'block';
    return;
  }
  data.reglages.tauxHoraire = taux;
  data.reglages.margePieces = marge / 100;
  await sauvegarder();
  alert('Réglages enregistrés.');
}

async function definirPin(){
  const nouveau = document.getElementById('r-nouveau-pin').value.trim();
  const confirme = document.getElementById('r-confirme-pin').value.trim();
  const err = document.getElementById('r-pin-erreur');
  if(!/^[0-9]{4,8}$/.test(nouveau)){
    err.textContent = 'Le code doit contenir entre 4 et 8 chiffres.';
    err.style.display = 'block';
    return;
  }
  if(nouveau !== confirme){
    err.textContent = 'Les deux codes ne correspondent pas.';
    err.style.display = 'block';
    return;
  }
  data.reglages.pin = nouveau;
  await sauvegarder();
  renderReglages();
}

async function enregistrerCatalogue(){
  const catalogue = Array.from(document.querySelectorAll('#catalogue-lignes > div'))
    .map(ligne=>{
      const nom = ligne.querySelector('.catalogue-nom').value.trim();
      const heures = parseFloat(ligne.querySelector('.catalogue-heures').value);
      if(!nom) return null;
      return { nom, heures: heures > 0 ? heures : null };
    })
    .filter(Boolean);
  data.reglages.catalogue = catalogue;
  await sauvegarder();
  alert('Interventions courantes enregistrées.');

async function activerSynchronisation(){
  const code = document.getElementById('r-code-sync').value.trim();
  const err = document.getElementById('r-sync-erreur');
  if(code.length < 6){
    err.textContent = 'Choisis un code d\'au moins 6 caractères, unique pour toi (ex. le nom de ton garage + une année).';
    err.style.display = 'block';
    return;
  }
  if(!firebaseDb){
    err.textContent = 'La connexion au service de synchronisation a échoué. Vérifie ta connexion internet.';
    err.style.display = 'block';
    return;
  }
  const distant = await recupererDepuisFirebase(code);
  if(distant){
    const confirmer = confirm('Des données existent déjà pour ce code. Fusionner avec les données de cet appareil (rien ne sera perdu des deux côtés) ?');
    if(!confirmer) return;
    data = fusionnerDonnees(data, distant);
    localStorage.setItem(CLE, JSON.stringify(data));
    localStorage.setItem('tab-code-sync', code);
    await sauvegarder();
  } else {
    const confirmer = confirm('Aucune donnée trouvée pour ce code. Créer un nouvel espace de synchronisation avec les données actuelles de cet appareil ?');
    if(!confirmer) return;
    localStorage.setItem('tab-code-sync', code);
    await sauvegarder();
  }
  renderReglages();
  render();
  demarrerEcouteSynchro(code);
  alert('Synchronisation activée — les mises à jour de l\'autre appareil arriveront désormais automatiquement, sans rien à faire.');
}

async function desactiverSynchronisation(){
  if(!confirm('Désactiver la synchronisation sur cet appareil ? Tes données restent sur ce téléphone mais ne seront plus mises à jour avec les autres appareils.')) return;
  localStorage.removeItem('tab-code-sync');
  arreterEcouteSynchro();
  renderReglages();
}

async function synchroniserMaintenant(){
  const code = localStorage.getItem('tab-code-sync');
  if(!code){ alert('Aucun code de synchronisation actif.'); return; }
  const distant = await recupererDepuisFirebase(code);
  const fusion = fusionnerDonnees(data, distant);
  const change = JSON.stringify(fusion) !== JSON.stringify(data);
  data = fusion;
  try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
  await synchroniserVersFirebase();
  render();
  alert(change ? 'Données fusionnées avec l\'autre appareil.' : 'Cet appareil était déjà à jour.');
}

document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState !== 'visible') return;
  const code = localStorage.getItem('tab-code-sync');
  if(!code || document.getElementById('verrou').style.display === 'flex') return;
  const distant = await recupererDepuisFirebase(code);
  if(!distant) return;
  const fusion = fusionnerDonnees(data, distant);
  const change = JSON.stringify(fusion) !== JSON.stringify(data);
  if(!change) return;
  data = fusion;
  try{ localStorage.setItem(CLE, JSON.stringify(data)); } catch(e){}
  render();
  synchroniserVersFirebase();
});

  i.type = 'intervention';

  if(!original) return;
  const copie = {
    ...original,

async function basculerPaiement(id){

function totalFiche(i){
  const mo = parseFloat(i.tarifMO) || 0;
  const p = parseFloat(i.coutPieces) || 0;
  return mo + p;
}
function totalVehicule(vehiculeId){
  return data.interventions
    .filter(i=>i.vehiculeId===vehiculeId && i.type==='intervention')
    .reduce((s,i)=>s+totalFiche(i), 0);
}
function totalClient(clientId){
  const idsVehicules = data.vehicules.filter(v=>v.clientId===clientId).map(v=>v.id);
  return data.interventions
    .filter(i=>idsVehicules.includes(i.vehiculeId) && i.type==='intervention')
    .reduce((s,i)=>s+totalFiche(i), 0);
}
function formatEuros(n){
  return n.toLocaleString('fr-FR', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}

function exporterSauvegarde(){
  const paquet = { data, images: {} };
  for(let k=0; k<localStorage.length; k++){
    const cle = localStorage.key(k);
    if(cle && cle.startsWith('img:')) paquet.images[cle] = localStorage.getItem(cle);
  }
  const blob = new Blob([JSON.stringify(paquet)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'tab-sauvegarde-' + d + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  localStorage.setItem('tab-dernier-export', new Date().toISOString());
}

async function importerSauvegarde(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const texte = await file.text();
    const paquet = JSON.parse(texte);
    if(!paquet || !paquet.data){ alert('Fichier de sauvegarde invalide.'); return; }
    const confirmer = confirm('Importer cette sauvegarde va remplacer toutes les données actuelles de l\'application. Continuer ?');
    if(!confirmer) return;
    data = paquet.data;
    await sauvegarder();
    if(paquet.images){
      Object.keys(paquet.images).forEach(cle => localStorage.setItem(cle, paquet.images[cle]));
    }
    localStorage.setItem('tab-dernier-export', new Date().toISOString());
    vue = 'clients'; clientCourant = null; vehiculeCourant = null;
    render();
    alert('Sauvegarde importée avec succès.');
  } catch(e){
    console.error(e);
    alert('Impossible de lire ce fichier de sauvegarde.');
  }
  evt.target.value = '';
}

function renderClients(){
  const cont = document.getElementById('contenu');
  const clients = [...data.clients].sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom));
  const today = new Date().toISOString().slice(0,10);

  const devisAvertir = data.interventions.filter(i=>i.type==='devis' && i.statutDevis==='valide' && !i.piecesCommandees);
  const impayes = data.interventions.filter(i=>i.type==='intervention' && i.statutPaiement==='non_paye' && totalFiche(i)>0);
  const debutJour = today;
  const debutMois = today.slice(0,7) + '-01';
  const debutAnnee = today.slice(0,4) + '-01-01';

  function totauxPeriode(depuis){
    const liste = data.interventions.filter(i=>i.type==='intervention' && i.date && i.date >= depuis);
    const total = liste.reduce((s,i)=>s+totalFiche(i), 0);
    const achat = liste.reduce((s,i)=>s+(parseFloat(i.prixAchatPieces)||0), 0);
    return { nb: liste.length, total: arrondi(total), marge: arrondi(total - achat) };
  }
  const statsJour = totauxPeriode(debutJour);
  const statsMois = totauxPeriode(debutMois);
  const statsAnnee = totauxPeriode(debutAnnee);

  const devisValidesEnAttente = data.interventions.filter(i=>i.type==='devis' && i.statutDevis==='valide');
  const potentielTotal = arrondi(devisValidesEnAttente.reduce((s,i)=>s+totalFiche(i), 0));
  const potentielAchat = devisValidesEnAttente.reduce((s,i)=>s+(parseFloat(i.prixAchatPieces)||0), 0);
  const potentielMarge = arrondi(potentielTotal - potentielAchat);

  const devisAAncienner = data.interventions.filter(i=>{
    if(i.type !== 'devis' || (i.statutDevis||'en_attente') !== 'en_attente' || !i.date) return false;
    const jours = Math.floor((Date.now() - new Date(i.date+'T00:00:00').getTime()) / 86400000);
    return jours >= 7;
  });
  const prochains = data.interventions
    .filter(i=>i.date && i.date >= today)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''))
    .slice(0,8);

  let dashboardHtml = '';
  if(devisAvertir.length){
    dashboardHtml += `<div class="alerte rouge"><div class="alerte-titre">Pièces à commander — devis validé${devisAvertir.length>1?'s':''}</div>`;
    devisAvertir.forEach(i=>{
      const { v, c } = infosVehicule(i.vehiculeId);
      dashboardHtml += `
        <div class="alerte-ligne">
          <span class="desc" onclick="allerInterventions('${i.vehiculeId}')"><b>${esc(i.titre)}</b> — ${esc(c?.prenom)} ${esc(c?.nom)}, ${esc(v?.marque)} ${esc(v?.modele)}</span>
          <button class="discret commande-btn" onclick="basculerPiecesCommandees('${i.id}')">Marquer commandé</button>
        </div>`;
    });
    dashboardHtml += `</div>`;
  }
  if(impayes.length){
    const totalImpaye = impayes.reduce((s,i)=>s+totalFiche(i),0);
    dashboardHtml += `<div class="alerte rouge"><div class="alerte-titre">Factures non payées — ${formatEuros(totalImpaye)} € au total</div>`;
    impayes.forEach(i=>{
      const { v, c } = infosVehicule(i.vehiculeId);
      dashboardHtml += `
        <div class="alerte-ligne">
          <span class="desc" onclick="allerInterventions('${i.vehiculeId}')"><b>${esc(i.titre)}</b> — ${esc(c?.prenom)} ${esc(c?.nom)}, ${esc(v?.marque)} ${esc(v?.modele)}</span>
          <button class="discret commande-btn" onclick="basculerPaiement('${i.id}')">Marquer payé</button>
        </div>`;
    });
    dashboardHtml += `</div>`;

function rechercherGlobal(valeur){
  requeteRecherche = valeur;
  if(!valeur.trim()){ renderClients(); return; }
  afficherResultatsRecherche(valeur);
}

function afficherResultatsRecherche(valeur){
  const zone = document.getElementById('zone-resultats');
  if(!zone) return;
  const q = valeur.trim().toLowerCase();
  if(!q){ zone.innerHTML = ''; return; }

  const clientsTrouves = data.clients.filter(c=>
    (c.prenom+' '+c.nom).toLowerCase().includes(q) ||
    (c.telephone||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q));
  const vehiculesTrouves = data.vehicules.filter(v=>
    (v.marque+' '+v.modele).toLowerCase().includes(q) ||
    (v.immatriculation||'').toLowerCase().includes(q));
  const interventionsTrouvees = data.interventions.filter(i=>
    (i.titre||'').toLowerCase().includes(q));

  if(!clientsTrouves.length && !vehiculesTrouves.length && !interventionsTrouvees.length){
    zone.innerHTML = `<div class="vide">Aucun résultat pour « ${esc(valeur)} ».</div>`;
    return;
  }

  let html = '';
  if(clientsTrouves.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Clients</div>`;
    clientsTrouves.forEach(c=>{
      html += `<button type="button" class="dossier" onclick="allerVehicules('${c.id}')">
        <span class="tab">${esc((c.prenom[0]||'')+(c.nom[0]||'')).toUpperCase()}</span>
        <div class="info"><div class="titre-d">${esc(c.prenom)} ${esc(c.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  if(vehiculesTrouves.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Véhicules</div>`;
    vehiculesTrouves.forEach(v=>{
      const c = data.clients.find(c=>c.id===v.clientId);
      html += `<button type="button" class="dossier" onclick="allerInterventions('${v.id}')">
        <span class="tab">${esc(v.immatriculation||'—')}</span>
        <div class="info"><div class="titre-d">${esc(v.marque)} ${esc(v.modele)} — ${esc(c?.prenom)} ${esc(c?.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  if(interventionsTrouvees.length){
    html += `<div class="resultat-groupe"><div class="resultat-groupe-titre">Fiches</div>`;
    interventionsTrouvees.forEach(i=>{
      const { v, c } = infosVehicule(i.vehiculeId);
      html += `<button type="button" class="dossier" onclick="allerInterventions('${i.vehiculeId}')">
        <span class="tab">${formatDate(i.date)}</span>
        <div class="info"><div class="titre-d">${esc(i.titre)} — ${esc(v?.marque)} ${esc(v?.modele)}, ${esc(c?.prenom)} ${esc(c?.nom)}</div></div>
      </button>`;
    });
    html += `</div>`;
  }
  zone.innerHTML = html;
}

  `;

  if(!interventions.length){
    html += `<div class="vide">Aucune fiche enregistrée pour ce véhicule.</div>`;

        const details = [];
        if(p.prixFacture) details.push(`${formatEuros(p.prixFacture)} €`);
        if(p.heures) details.push(`MO ${p.heures} h (${formatEuros(p.tarifMO)} €)`);
        return `<li style="padding:3px 0;border-bottom:1px dashed var(--border);">
          <div style="display:flex;justify-content:space-between;"><span>${esc(p.nom)}${p.ref ? ` <span style="color:var(--text-muted);font-size:11px;">(réf. ${esc(p.ref)})</span>` : ''}</span></div>
          ${details.length ? `<div style="text-align:right;font-size:12px;color:var(--text-muted);">${details.join(' · ')}</div>` : ''}
        </li>`;
      }).join('')}</ul></div>`;
    } else if(i.pieces){
      piecesHtml = `<div class="fiche-pieces"><b>${labelPieces}</b>${esc(i.pieces)}</div>`;
    }
    let tarifsHtml = '';
    const tarifs = [];
    if(i.heuresMO) tarifs.push(`<span>Main d'œuvre&nbsp;: <b>${esc(i.heuresMO)} h → ${formatEuros(i.tarifMO)} €</b></span>`);
    if(i.prixAchatPieces) tarifs.push(`<span>Pièces&nbsp;: <b>${formatEuros(i.coutPieces)} €</b> (achat ${esc(i.prixAchatPieces)} €)</span>`);
    const tf = totalFiche(i);
    if(tf > 0) tarifs.push(`<span class="total">Total&nbsp;: <b>${formatEuros(tf)} €</b></span>`);
    if(tarifs.length) tarifsHtml = `<div class="fiche-tarifs">${tarifs.join('')}</div>`;
    let paiementHtml = '';
    if(i.type === 'intervention' && tf > 0){
      const paye = i.statutPaiement === 'paye';
      paiementHtml = `<div class="paiement-toggle"><button type="button" class="badge ${paye?'paye':'non_paye'}" onclick="basculerPaiement('${i.id}')">${paye?'Payé':'Non payé'}</button></div>`;
    }

          <button class="bouton-icone" title="Modifier" onclick="ouvrirEditionIntervention('${i.id}')">✎</button>
          <button class="bouton-icone danger" title="Supprimer">✕</button>

      <div class="pieces-jointes" id="pj-${i.id}"></div>

        <button onclick="dupliquerFiche('${i.id}')">Dupliquer</button>

    `;
    fiche.querySelector('button[title="Supprimer"]').addEventListener('click', async ()=>{

      (i.controles||[]).forEach(async (_,idx)=>await supprimerImg(i.id+':ct:'+idx));

      await sauvegarder();

async function renderPiecesJointes(i){
  const cont = document.getElementById('pj-'+i.id);
  const titreEl = document.getElementById('pj-titre-'+i.id);
  if(!cont) return;
  let any = false;
  if(i.facturePhoto){
    const url = await chargerImg(i.id+':facture');
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Document')); }
  }
  for(let idx=0; idx<(i.factures||[]).length; idx++){
    const url = await chargerImg(i.id+':facture:'+idx);
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Document')); }
  }
  for(let idx=0; idx<(i.controles||[]).length; idx++){
    const url = await chargerImg(i.id+':ct:'+idx);
    if(url){ any = true; cont.appendChild(creerVignette(url, 'Contrôle technique')); }
  }
  if(any) titreEl.style.display = 'block';
}

function telechargerFichier(dataUrl, nomFichier){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = nomFichier;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function ouvrirLightbox(dataUrl){
  const overlay = document.getElementById('lightbox');
  overlay.innerHTML = `
    <img src="${dataUrl}" style="max-width:92vw;max-height:80vh;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.3);">
    <button class="primaire" onclick="fermerLightbox()">Fermer</button>
  `;
  overlay.style.display = 'flex';
}
function fermerLightbox(){
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox').innerHTML = '';
}

function creerVignette(dataUrl, label){
  let el;
  const estImage = dataUrl.startsWith('data:image');
  if(estImage){
    el = document.createElement('img');
    el.className = 'vignette';
    el.src = dataUrl;
    el.title = label;
    el.addEventListener('click', ()=>ouvrirLightbox(dataUrl));
  } else {
    el = document.createElement('div');
    el.className = 'vignette-doc';
    el.textContent = label + ' (PDF) — télécharger';
    el.addEventListener('click', ()=>telechargerFichier(dataUrl, label.replace(/\s+/g,'-').toLowerCase() + '.pdf'));
  }
  return el;
}

function suggererTempsHabituel(){
  const titre = document.getElementById('i-titre').value.trim().toLowerCase();
  const catalogue = data.reglages.catalogue || [];
  const trouve = catalogue.find(entree=>entree.nom.toLowerCase() === titre);
  const zone = document.getElementById('suggestion-catalogue');
  if(trouve && trouve.heures){
    zone.style.display = 'block';
    zone.innerHTML = `⏱ Temps habituel pour cette intervention : ${trouve.heures} h — <button type="button" class="discret" style="text-decoration:underline;padding:0;" onclick="appliquerTempsHabituel(${trouve.heures})">Appliquer à la première pièce</button>`;

    zone.style.display = 'none';
  }

function appliquerTempsHabituel(heures){
  const premiereCarte = document.querySelector('#pieces-lignes .piece-carte');
  if(premiereCarte){
    premiereCarte.querySelector('.piece-heures').value = heures;
    calculerApercus();
  }

async function ouvrirEditionIntervention(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  interventionEnEdition = id;
  piecesJointesTemp = { factures: [], controles: [] };
  document.getElementById('form-intervention-titre').textContent = 'Modifier la fiche';
  document.getElementById('form-intervention').classList.add('ouvert');
  document.getElementById('i-titre').value = i.titre || '';
  peuplerListeCatalogue();
  document.getElementById('suggestion-catalogue').style.display = 'none';
  document.getElementById('i-date').value = i.date || '';
  document.getElementById('i-km').value = i.km || '';
  choisirType(i.type || 'intervention');
  if(i.type === 'devis') choisirStatutDevis(i.statutDevis || 'en_attente');
  choisirMarge(i.margeZero ? 'zero' : 'normale');

  document.getElementById('pieces-lignes').innerHTML = '';
  if(i.piecesListe && i.piecesListe.length){
    i.piecesListe.forEach(p=>ajouterLignePiece(p.nom, p.ref, p.prixAchat, p.heures));
  } else if(i.prixAchatPieces || i.heuresMO){
    ajouterLignePiece(i.pieces || 'Pièces', '', i.prixAchatPieces, i.heuresMO);
  } else {
    ajouterLignePiece();
  }
  calculerApercus();

  document.getElementById('defauts-lignes').innerHTML = '';
  if(i.defauts && i.defauts.length){
    i.defauts.forEach(d=>{
      ajouterLigneDefaut();
      const inputs = document.querySelectorAll('#defauts-lignes input');
      inputs[inputs.length-1].value = d;
    });
  } else {
    ajouterLigneDefaut();
  }

  document.getElementById('apercu-facture').innerHTML = '';
  document.getElementById('apercu-ct').innerHTML = '';
  if(i.facturePhoto){
    const url = await chargerImg(id+':facture');
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Document existant'));
      document.getElementById('apercu-facture').appendChild(item);
    }
  }
  for(let idx=0; idx<(i.factures||[]).length; idx++){
    const url = await chargerImg(id+':facture:'+idx);
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Document existant'));
      document.getElementById('apercu-facture').appendChild(item);
    }
  }
  for(let idx=0; idx<(i.controles||[]).length; idx++){
    const url = await chargerImg(id+':ct:'+idx);
    if(url){
      const item = document.createElement('div');
      item.className = 'apercu-item';
      item.appendChild(creerVignette(url, 'Contrôle technique actuel'));
      document.getElementById('apercu-ct').appendChild(item);
    }
  }
}

function arrondi(n){ return Math.round(n*100)/100; }

function ajouterLignePiece(nom, ref, prixAchat, heures){
  const cont = document.getElementById('pieces-lignes');
  const carte = document.createElement('div');
  carte.className = 'piece-carte';
  carte.innerHTML = `
    <div class="piece-entete">
      <input type="text" class="piece-nom" placeholder="Nom de la pièce" value="${nom ? esc(nom) : ''}">
      <button type="button" class="discret" onclick="this.closest('.piece-carte').remove(); calculerApercus();">✕</button>
    </div>
    <div class="piece-champs">
      <div class="champ"><label>Référence</label><input type="text" class="piece-ref" placeholder="Réf." value="${ref ? esc(ref) : ''}"></div>
      <div class="champ"><label>Prix d'achat €</label><input type="number" class="piece-prix" placeholder="0" value="${prixAchat ? esc(String(prixAchat)) : ''}" oninput="calculerApercus()"></div>
      <div class="champ"><label>Main d'œuvre (h)</label><input type="number" step="0.25" class="piece-heures" placeholder="0" value="${heures ? esc(String(heures)) : ''}" oninput="calculerApercus()"></div>
    </div>
    <div class="piece-sous-total"></div>
  `;
  cont.appendChild(carte);
  calculerApercus();
}

function choisirMarge(type){
  margeSelectionnee = type;
  document.getElementById('marge-normale').classList.toggle('actif', type==='normale');
  document.getElementById('marge-zero').classList.toggle('actif', type==='zero');
  calculerApercus();
}

function calculerApercus(){
  const margeAppliquee = margeSelectionnee === 'zero' ? 0 : (data.reglages.margePieces||0);
  let totalAchat = 0, totalFacture = 0, totalHeures = 0, totalMO = 0;
  document.querySelectorAll('#pieces-lignes .piece-carte').forEach(carte=>{
    const prix = parseFloat(carte.querySelector('.piece-prix').value);
    const heures = parseFloat(carte.querySelector('.piece-heures').value);
    const sousTotal = carte.querySelector('.piece-sous-total');
    const parties = [];
    if(prix > 0){
      const facture = arrondi(prix * (1 + margeAppliquee));
      parties.push(`Pièce&nbsp;: ${formatEuros(facture)} €`);
      totalAchat += prix; totalFacture += facture;
    }
    if(heures > 0){
      const tarifLigne = arrondi(heures * data.reglages.tauxHoraire);
      parties.push(`MO&nbsp;: ${formatEuros(tarifLigne)} €`);
      totalHeures += heures; totalMO += tarifLigne;
    }
    sousTotal.innerHTML = parties.join(' · ');
  });
  const apercuPieces = document.getElementById('apercu-pieces');
  const apercuMO = document.getElementById('apercu-mo');
  apercuPieces.textContent = totalFacture > 0 ? `Total pièces facturées : ${formatEuros(arrondi(totalFacture))} € (marge ${Math.round(margeAppliquee*100)} %)` : '';
  apercuMO.textContent = totalMO > 0 ? `Total main d'œuvre : ${totalHeures} h → ${formatEuros(arrondi(totalMO))} €` : '';
}

async function ajouterFacture(evt){
  const files = Array.from(evt.target.files);
  const cont = document.getElementById('apercu-facture');
  for(const file of files){
    const url = await fichierVersBase64(file);
    const idx = piecesJointesTemp.factures.length;
    piecesJointesTemp.factures.push(url);
    const item = document.createElement('div');
    item.className = 'apercu-item';
    item.appendChild(creerVignette(url, 'Document'));
    const retirer = document.createElement('button');
    retirer.className = 'retirer'; retirer.textContent = '✕';
    retirer.onclick = ()=>{ piecesJointesTemp.factures[idx] = null; item.remove(); };
    item.appendChild(retirer);
    cont.appendChild(item);
  }
}

async function ajouterCT(evt){

    const idx = piecesJointesTemp.controles.length;

}

function sautDePageSiNecessaire(doc, y){
  if(y > 275){ doc.addPage(); return 20; }
  return y;
}

function imprimerReleveVehicule(vehiculeId){
  const { v, c } = infosVehicule(vehiculeId);
  const interventions = data.interventions
    .filter(i=>i.vehiculeId===vehiculeId && i.type==='intervention')
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!interventions.length){
    alert('Aucune intervention facturée pour ce véhicule pour le moment.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text("Relevé d'entretien", 14, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(148,138,121);
  doc.text(`Édité le ${formatDate(new Date().toISOString().slice(0,10))}`, 14, y); y += 10;
  doc.setTextColor(43,38,31); doc.setFontSize(11);
  doc.text(`Client : ${c?.prenom||''} ${c?.nom||''}`, 14, y); y += 7;

function ouvrirGoogleAgenda(intervention, client, vehicule){
  const debut = dateVersICS(intervention.date, 0);
  const fin = dateVersICS(intervention.date, 1);
  const resume = `${intervention.type === 'devis' ? 'Devis' : 'Intervention'} — ${intervention.titre}`;
  const description = `${vehicule ? vehicule.marque + ' ' + vehicule.modele : ''}${vehicule?.immatriculation ? ' (' + vehicule.immatriculation + ')' : ''}${client ? ' — client : ' + client.prenom + ' ' + client.nom : ''}`;
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(resume)
    + '&dates=' + debut + '/' + fin
    + '&details=' + encodeURIComponent(description);
  window.open(url, '_blank');
}

function imprimerFiche(id){
  const i = data.interventions.find(x=>x.id===id);
  if(!i) return;
  const { v, c } = infosVehicule(i.vehiculeId);
  const labelPieces = i.type === 'devis' ? 'Pièces prévues' : 'Pièces remplacées';
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(i.type==='devis' ? 'Devis' : "Fiche d'intervention", 14, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(148,138,121);
  doc.text(formatDate(i.date), 196, y, { align: 'right' });
  y += 6; doc.setDrawColor(231,222,205); doc.line(14, y, 196, y); y += 9;

  doc.setTextColor(43,38,31); doc.setFontSize(11);
  doc.text(`Client : ${c?.prenom||''} ${c?.nom||''}`, 14, y); y += 7;
  doc.text(`Véhicule : ${v?.marque||''} ${v?.modele||''}${v?.immatriculation ? ' — '+v.immatriculation : ''}`, 14, y); y += 7;
  if(i.km){ doc.text(`Kilométrage : ${i.km} km`, 14, y); y += 7; }
  y += 3;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(i.titre || '', 14, y); y += 8;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);

  if(i.piecesListe && i.piecesListe.length){
    doc.setFont('helvetica','bold');
    doc.text(labelPieces + ' :', 14, y); y += 6;
    doc.setFont('helvetica','normal');
    i.piecesListe.forEach(p=>{
      y = sautDePageSiNecessaire(doc, y);
      const nomAffiche = p.ref ? `${p.nom} (réf. ${p.ref})` : p.nom;
      doc.text(`• ${nomAffiche}`, 18, y);
      if(p.prixFacture) doc.text(`${formatEuros(p.prixFacture)} €`, 196, y, { align: 'right' });
      y += 6;
      if(p.heures){
        doc.setFontSize(9); doc.setTextColor(148,138,121);
        doc.text(`Main d'œuvre : ${p.heures} h (${formatEuros(p.tarifMO)} €)`, 22, y);
        doc.setFontSize(11); doc.setTextColor(43,38,31);
        y += 6;
      }
    });
    y += 4;
  } else if(i.pieces){
    const lignes = doc.splitTextToSize(`${labelPieces} : ${i.pieces}`, 180);
    doc.text(lignes, 14, y); y += lignes.length*6 + 5;
  }

  if(i.defauts && i.defauts.length){
    doc.setFont('helvetica','bold');
    doc.text('Défauts constatés :', 14, y); y += 6;
    doc.setFont('helvetica','normal');
    i.defauts.forEach(d=>{
      y = sautDePageSiNecessaire(doc, y);
      const lignes = doc.splitTextToSize('• ' + d, 175);
      doc.text(lignes, 18, y); y += lignes.length*6;
    });
    y += 4;
  }

  if(i.heuresMO || i.prixAchatPieces){
    y = sautDePageSiNecessaire(doc, y);
    doc.setDrawColor(231,222,205); doc.line(14, y, 196, y); y += 9;
    doc.setFontSize(11);
    if(i.heuresMO){
      doc.text(`Main d'œuvre (${i.heuresMO} h)`, 14, y);
      doc.text(`${formatEuros(i.tarifMO)} €`, 196, y, { align: 'right' }); y += 7;
    }
    if(i.prixAchatPieces){
      doc.text('Pièces', 14, y);
      doc.text(`${formatEuros(i.coutPieces)} €`, 196, y, { align: 'right' }); y += 7;
    }
    doc.setFont('helvetica','bold');
    doc.text('Total', 14, y);
    doc.text(`${formatEuros(totalFiche(i))} €`, 196, y, { align: 'right' });
  }

  const nomBase = (i.titre||'fiche').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  doc.save(`${i.type==='devis'?'devis':'intervention'}-${nomBase}.pdf`);
}

function icsEscape(str){
  return String(str||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function dateVersICS(iso, decalageJours){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + (decalageJours||0));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const j = String(d.getDate()).padStart(2,'0');
  return `${y}${m}${j}`;
}
function creerEtTelechargerICS(intervention, client, vehicule){
  const debut = dateVersICS(intervention.date, 0);
  const fin = dateVersICS(intervention.date, 1);
  const maintenant = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const resume = `${intervention.type === 'devis' ? 'Devis' : 'Intervention'} — ${intervention.titre}`;
  const description = `${vehicule ? vehicule.marque + ' ' + vehicule.modele : ''}${vehicule?.immatriculation ? ' (' + vehicule.immatriculation + ')' : ''}${client ? ' — client : ' + client.prenom + ' ' + client.nom : ''}`;
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TAB//FR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + intervention.id + '@tab-app',
    'DTSTAMP:' + maintenant,
    'DTSTART;VALUE=DATE:' + debut,
    'DTEND;VALUE=DATE:' + fin,
    'SUMMARY:' + icsEscape(resume),
    'DESCRIPTION:' + icsEscape(description),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Rappel','TRIGGER:-P1D','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rdv-' + intervention.id + '.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

async function enregistrerIntervention(){
  const titre = document.getElementById('i-titre').value.trim();
  const date = document.getElementById('i-date').value;
  const km = document.getElementById('i-km').value.trim();
  const margeAppliquee = margeSelectionnee === 'zero' ? 0 : (data.reglages.margePieces||0);

  const piecesListe = Array.from(document.querySelectorAll('#pieces-lignes .piece-carte'))
    .map(carte=>{
      const nom = carte.querySelector('.piece-nom').value.trim();
      const ref = carte.querySelector('.piece-ref').value.trim();
      const prixAchat = parseFloat(carte.querySelector('.piece-prix').value);
      const heures = parseFloat(carte.querySelector('.piece-heures').value);
      if(!nom && !(prixAchat > 0) && !(heures > 0)) return null;
      const prixFacture = prixAchat > 0 ? arrondi(prixAchat * (1 + margeAppliquee)) : 0;
      const tarifMOligne = heures > 0 ? arrondi(heures * data.reglages.tauxHoraire) : 0;
      return {
        nom: nom || 'Pièce', ref,
        prixAchat: prixAchat > 0 ? prixAchat : 0, prixFacture,
        heures: heures > 0 ? heures : 0, tarifMO: tarifMOligne
      };
    })
    .filter(Boolean);
  const prixAchatPieces = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.prixAchat,0)) : '';
  const coutPieces = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.prixFacture,0)) : '';
  const heuresMO = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.heures,0)) : '';
  const tarifMO = piecesListe.length ? arrondi(piecesListe.reduce((s,p)=>s+p.tarifMO,0)) : '';
  const margeZero = margeSelectionnee === 'zero';

  const err = document.getElementById('i-erreur');
  if(!titre || !date){ err.textContent='Merci de renseigner au moins l\'intitulé et la date.'; err.style.display='block'; return; }

  const defauts = Array.from(document.querySelectorAll('#defauts-lignes input'))
    .map(inp=>inp.value.trim()).filter(Boolean);

  const id = interventionEnEdition || genId();
  const controlesValides = piecesJointesTemp.controles.filter(Boolean);
  const facturesValides = piecesJointesTemp.factures.filter(Boolean);

  if(interventionEnEdition){
    const existante = data.interventions.find(x=>x.id===interventionEnEdition);
    const nbControlesAvant = (existante.controles||[]).length;
    const nbFacturesAvant = (existante.factures||[]).length;
    Object.assign(existante, {
      type: typeSelectionne, titre, date, km,
      piecesListe, heuresMO, prixAchatPieces, tarifMO, coutPieces, margeZero,
      statutDevis: typeSelectionne==='devis' ? statutDevisSelectionne : undefined,
      defauts, _maj: Date.now()
    });
    delete existante.pieces;
    for(let idx=0; idx<facturesValides.length; idx++){
      await sauvegarderImg(id+':facture:'+(nbFacturesAvant+idx), facturesValides[idx]);
    }
    if(facturesValides.length){
      existante.factures = [...(existante.factures||[]), ...facturesValides.map(()=>true)];
    }
    for(let idx=0; idx<controlesValides.length; idx++){
      await sauvegarderImg(id+':ct:'+(nbControlesAvant+idx), controlesValides[idx]);
    }
    if(controlesValides.length){
      existante.controles = [...(existante.controles||[]), ...controlesValides.map(()=>true)];
    }
    await sauvegarder();
    fermerFormIntervention();
    render();
    return;
  }

  const nouvelleIntervention = {
    id, vehiculeId: vehiculeCourant, type: typeSelectionne, titre, date, km,
    piecesListe, heuresMO, prixAchatPieces, tarifMO, coutPieces, margeZero,
    statutDevis: typeSelectionne==='devis' ? statutDevisSelectionne : undefined,
    statutPaiement: typeSelectionne==='intervention' ? 'non_paye' : undefined,
    piecesCommandees: false,
    defauts,
    factures: facturesValides.map(()=>true),
    controles: controlesValides.map(()=>true),
    _maj: Date.now()
  };
  data.interventions.push(nouvelleIntervention);

  for(let idx=0; idx<facturesValides.length; idx++){
    await sauvegarderImg(id+':facture:'+idx, facturesValides[idx]);
  }
  for(let idx=0; idx<controlesValides.length; idx++){
    await sauvegarderImg(id+':ct:'+idx, controlesValides[idx]);
  }

  await sauvegarder();
  const { v, c } = infosVehicule(vehiculeCourant);
  creerEtTelechargerICS(nouvelleIntervention, c, v);
  fermerFormIntervention();
  render();
}
